  - name: notification_channel_tested
    section: Pravix notifications
    description: >-
      The outcome of "Send test message" on a channel. Sent from POST /api/v1/integrations/:id/test after the
      sample alert is posted (status=success) or when anything in the handler throws (status=failed,
      failure_reason=send_error), before the 502. Not sent for a channel outside the account (404).
    question: Do channels work when people first test them, and which providers fail?
    track_via: server
    properties:
      - { name: account_id, type: string, example: 719f7f5d-8de3-4ac0-be12-8f156cc8f00d }
      - { name: channel_id, type: string, example: 3f0c2a7e-9b1d-4e8a-a6c2-5d7f1e9b0c44 }
      - { name: provider, type: string, example: slack | discord, values: [slack, discord] }
      - { name: status, type: string, example: success | failed, values: [success, failed] }
      - { name: failure_reason, type: string, example: send_error, values: [send_error], only_when: status=failed }
    fires_at:
      - page: /settings
        from: The Pravix app at app.joindatalyze.com/pravix (the router's base path)
        element: button "Send test message" (on a channel's row)
        trigger: server
        api: POST /api/v1/integrations/[id]/test
        needs: [signed_in, a channel exists]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
