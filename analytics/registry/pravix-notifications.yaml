      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }

  - name: notification_channel_updated
    section: Pravix notifications
    description: >-
      A channel's settings were changed. Sent from PATCH /api/v1/integrations/:id after the row is updated,
      with the fields the request changed and the channel's enabled and min_severity after the change. Not
      sent for a channel outside the account, a request with no valid field, or a failed write.
    question: How often do people mute channels or change how noisy they are, and in which direction?
    track_via: server
    properties:
      - { name: account_id, type: string, example: 719f7f5d-8de3-4ac0-be12-8f156cc8f00d }
      - { name: channel_id, type: string, example: 3f0c2a7e-9b1d-4e8a-a6c2-5d7f1e9b0c44 }
      - { name: provider, type: string, example: slack | discord, values: [slack, discord] }
      - { name: fields_changed, type: array, example: "[enabled] | [minSeverity]", description: "The request's field names as the API spells them: enabled, minSeverity, setupId, label" }
      - { name: enabled, type: boolean, example: "true | false" }
      - { name: min_severity, type: string, example: alert | all, values: [alert, all] }
    fires_at:
      - page: /settings
        from: The Pravix app at app.joindatalyze.com/pravix (the router's base path)
        element: switch "Enabled" (on a channel's row)
        trigger: server
        api: PATCH /api/v1/integrations/[id]
        needs: [signed_in, a channel exists]
      - page: /settings
        from: The Pravix app at app.joindatalyze.com/pravix (the router's base path)
        element: combobox "Minimum severity" (on a channel's row)
        trigger: server
        api: PATCH /api/v1/integrations/[id]
        needs: [signed_in, a channel exists]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
