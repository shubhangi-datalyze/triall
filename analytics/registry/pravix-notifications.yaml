  - name: email_notifications_toggled
    section: Pravix notifications
    description: >-
      A person turned their own alert emails on or off. Sent from PATCH /api/v1/users/preferences after the
      preference is saved, on that person, with the new value. Not sent when the body isn't a boolean or the
      write fails. The setting only matters for account admins: only admins with it on get run alert emails.
    question: How many people turn alert emails off, and does it follow a run of noisy alerts?
    track_via: server
    properties:
      - { name: enabled, type: boolean, example: "false | true" }
    fires_at:
      - page: /settings
        from: The Pravix app at app.joindatalyze.com/pravix (the router's base path)
        element: switch "Email Notifications" (Notifications card)
        trigger: server
        api: PATCH /api/v1/users/preferences
