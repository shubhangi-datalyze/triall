events:
  - name: notification_channel_added
    section: Pravix notifications
    description: >-
      A Slack or Discord channel was saved for the account. Sent from POST /api/v1/integrations after
      storage.createNotificationChannel writes the row (Discord webhooks are verified first), on the person
      in Settings. Not sent when the request is refused (unknown provider, missing or invalid webhook URL,
      Discord webhook that can't be verified, setup outside the account, encryption not configured) or the
      write fails.
    question: How many accounts connect a Slack or Discord channel, which provider, and for every setup or one?
    track_via: server
    properties:
      - { name: account_id, type: string, example: 719f7f5d-8de3-4ac0-be12-8f156cc8f00d }
      - { name: channel_id, type: string, example: 3f0c2a7e-9b1d-4e8a-a6c2-5d7f1e9b0c44 }
      - { name: provider, type: string, example: slack | discord, values: [slack, discord] }
      - { name: min_severity, type: string, example: alert | all, values: [alert, all] }
      - { name: scoped_to_setup, type: boolean, example: "false | true" }
    fires_at:
      - page: /settings
        from: The Pravix app at app.joindatalyze.com/pravix (the router's base path)
        element: button "Add channel" (in the "Add a notification channel" dialog)
        trigger: server
        api: POST /api/v1/integrations
        needs: [signed_in, a valid Slack or Discord webhook URL]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
