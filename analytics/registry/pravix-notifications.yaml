  - name: notification_sent
    section: Pravix notifications
    description: >-
      The outcome of delivering a completed run's alert to one destination, sent by the notification
      dispatcher on the account owner: once for email (only when the run's aggregated status isn't ok) and
      once per enabled Slack or Discord channel whose minimum severity the run clears. status=success after
      the send resolves, status=failed with failure_reason=send_error when it throws. Not sent when the
      notification content can't be built, when a channel's provider has no registered sender, or when no
      destination qualifies. The email success is also sent when the notifier finds no eligible admin and
      sends nothing.
    question: How many run alerts reach people each day, by email or which chat provider, and how many fail?
    track_via: server
    properties:
      - { name: account_id, type: string, example: 719f7f5d-8de3-4ac0-be12-8f156cc8f00d }
      - { name: run_id, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: setup_id, type: string, example: 9612d3cd-5c3d-4e1b-8a5b-b5428916160a }
      - { name: channel, type: string, example: email | slack | discord, values: [email, slack, discord] }
      - { name: channel_id, type: string, example: 3f0c2a7e-9b1d-4e8a-a6c2-5d7f1e9b0c44, only_when: channel=slack|discord }
      - { name: severity, type: string, example: alert | skipped | ok, values: [ok, alert, skipped], description: "The run's aggregated status; email only goes out on alert or skipped" }
      - { name: status, type: string, example: success | failed, values: [success, failed] }
      - { name: failure_reason, type: string, example: send_error, values: [send_error], only_when: status=failed }
    fires_at:
      - element: the run's completion message (email to the account's admins)
        trigger: server
        api: POST /api/v1/internal/pubsub/completion
        needs: [a run completed or failed with aggregated status alert or skipped]
      - element: the run's completion message (one per matching Slack or Discord channel)
        trigger: server
        api: POST /api/v1/internal/pubsub/completion
        needs: [a run completed or failed, an enabled channel whose minimum severity the run clears]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
