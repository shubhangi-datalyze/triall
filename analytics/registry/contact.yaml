      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: calendly_event_scheduled
    section: Contact and booking
    description: >-
      The /contact/booked page loads. Calendly redirects the invitee there after a booking on
      calendly.com/ansh-datalyze/chat is confirmed, but the event is sent on every load of the page: a reload,
      a revisit, a direct visit, and the /admin editor's preview of the page
      (/admin/preview/live/contact/booked) all count. A booking whose redirect never loads is not counted.
      location is always contact_page.
    question: How many discovery calls were booked last week, and what share of contact-form leads went on to book?
    track_via: client
    pair: contact_lead_captured
    properties:
      - { name: location, type: string, example: contact_page, values: [contact_page] }
    fires_at:
      - page: /contact/booked
        trigger: page_load
        from: "send the contact form at /contact, pick a time on calendly.com/ansh-datalyze/chat; Calendly redirects here"
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Calendly Event Scheduled
    section: Contact and booking
    description: >-
      The Title Case name of calendly_event_scheduled: sent from the line next to it, at the same moment and
      with the same properties (see calendly_event_scheduled). Both are sent until 2026-12-18.
    question: How many discovery calls were booked last week, and what share of contact-form leads went on to book?
    track_via: client
    status: deprecated
    deprecated_reason: The 18 Nov 2026 rename to snake_case; calendly_event_scheduled replaces it and both are sent side by side until dual_fire_until.
