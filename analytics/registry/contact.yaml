        trigger: click
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: contact_form_submit_blocked
    section: Contact and booking
    description: >-
      The visitor presses Pick a time and the browser refuses the submit before any request: Name is empty, or
      Work email is empty or not an email. One event per refused press, for the first failing field only (name
      is checked before email). Errors from /api/contact after a valid submit don't send it.
    question: How often does the browser refuse the contact form, on which field and why?
    track_via: client
    properties:
      - { name: field, type: string, example: name | email, values: [name, email] }
      - { name: reason, type: string, example: missing | invalid_email, values: [missing, invalid_email] }
      - { name: location, type: string, example: contact_page, values: [contact_page] }
    fires_at:
      - page: /contact
        element: button "Pick a time →"
        trigger: submit
        needs: [Name empty]
      - page: /contact
        element: button "Pick a time →"
        trigger: submit
        needs: [Name filled, Work email empty or not an email]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Contact Form Validation Error
    section: Contact and booking
    description: >-
      The Title Case name of contact_form_submit_blocked: sent from the line next to it, at the same moment
      and with the same properties (see contact_form_submit_blocked). Both are sent until 2026-12-18.
    question: How often does the browser refuse the contact form, on which field and why?
    track_via: client
    status: deprecated
    deprecated_reason: The 18 Nov 2026 rename to snake_case; contact_form_submit_blocked replaces it and both are sent side by side until dual_fire_until.
    replaced_by: contact_form_submit_blocked
    dual_fire_until: 2026-12-18
    properties:
      - { name: field, type: string, example: name | email, values: [name, email] }
      - { name: reason, type: string, example: missing | invalid_email, values: [missing, invalid_email] }
      - { name: location, type: string, example: contact_page, values: [contact_page] }
    fires_at:
      - page: /contact
        element: button "Pick a time →"
        trigger: submit
        needs: [Name empty]
      - page: /contact
        element: button "Pick a time →"
        trigger: submit
        needs: [Name filled, Work email empty or not an email]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: contact_form_submitted
    section: Contact and booking
    description: >-
      The visitor presses Pick a time and the form passes the browser's checks (a name and a valid email).
      Sent in the browser before the request to /api/contact, so it counts every attempt, including ones the
      route rejects or that fail on the network; a retry after an error sends it again.
    question: How many contact form submits do we get, how long do they take, and how many become leads?
    track_via: client
    pair: contact_lead_captured
    properties:
      - { name: location, type: string, example: contact_page, values: [contact_page] }
      - { name: completed_fields, type: array, example: "[name, email, goal]", description: "The fields the person left filled (blurred with a non-empty value) before submitting, in the order they were completed; a field submitted with Enter or autofilled without leaving it is not in it" }
      - { name: completed_count, type: numeric, example: "3", description: "How many fields are in completed_fields" }
      - { name: completed_optional, type: boolean, example: true | false, description: "The optional Company website field was filled at submit" }
      - { name: time_to_first_input_ms, type: numeric, example: "4210", description: "Form mount to the first focus or edit of a field, in the browser (performance.now)" }
      - { name: time_to_submit_ms, type: numeric, example: "38250", description: "Form mount to the submit, in the browser (performance.now)" }
    fires_at:
      - page: /contact
        element: button "Pick a time →"
        trigger: submit
        needs: [Name filled, a valid Work email]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Contact Form Submitted
    section: Contact and booking
