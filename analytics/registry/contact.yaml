        trigger: page_load
        from: "send the contact form at /contact, pick a time on calendly.com/ansh-datalyze/chat; Calendly redirects here"
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: call_booked_from_playbook
    section: Contact and booking
    description: >-
      Sent on the same load of /contact/booked as calendly_event_scheduled, only when this tab's session
      storage holds the playbook call-intent marker. CallLink sets the marker when a reader clicks Book a call
      in a chapter's ContactCTA box; this event reads and clears it, so it counts once per marked visit. Not
      sent for bookings that started anywhere else, in another tab or in a later session.
    question: How many booked calls started from a playbook chapter, and from which chapters?
    track_via: client
    properties:
      - { name: chapter_slug, type: string, example: creating-a-tracking-plan | analytics-strategy }
      - { name: part, type: string, example: foundations | what-to-measure | trustworthy-data }
      - { name: signed_in, type: boolean, example: true | false, description: "The reader was signed in when they clicked Book a call" }
      - { name: entry_page, type: string, example: /playbook/creating-a-tracking-plan, description: "The page this visit entered the playbook on" }
    fires_at:
      - page: /contact/booked
        trigger: page_load
        needs: [the playbook call-intent marker in this tab's session storage]
        from: "click link \"Book a call\" in the box partway through a chapter (/playbook/[slug]), send the contact form and book on Calendly in the same tab; Calendly redirects here"
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
