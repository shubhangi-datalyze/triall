events:
  - name: contact_form_viewed
    section: Contact and booking
    description: >-
      The contact form on /contact mounts. Sent once per mount from a useEffect, so a reload or a return visit
      sends it again. It also mounts, and sends, inside the /admin editor's preview of the page
      (/admin/preview/live/contact) on the production host, and on localhost when
      NEXT_PUBLIC_MIXPANEL_SEND_LOCAL=1. entry_point carries the page URL's ?source (the /ask links set one)
      when it is a plain key of lower-case letters, digits and underscores; most visits have none.
    question: How many people open the contact page each week, and what share of them go on to send the form and book a call?
    track_via: client
    properties:
      - { name: location, type: string, example: contact_page, values: [contact_page] }
      - { name: entry_point, type: string, example: ask | ask_answer, only_when: "the /contact URL carries a ?source of lower-case letters, digits and underscores (the /ask chat's and /ask/[slug]'s links to /contact)", description: "The /contact URL's ?source" }
    fires_at:
      - page: /contact
        element: the contact form (the page loads)
        trigger: page_load
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
      - { date: 2026-11-20, ref: "branch main (audit F4)", change: "Added entry_point, from the /contact URL's ?source" }
  - name: Contact Form Viewed
    section: Contact and booking
    description: >-
      The Title Case name of contact_form_viewed: sent from the line next to it, at the same moment and with
      the same properties (see contact_form_viewed). Both are sent until 2026-12-18.
    question: How many people open the contact page each week, and what share of them go on to send the form and book a call?
    track_via: client
    status: deprecated
    deprecated_reason: The 18 Nov 2026 rename to snake_case; contact_form_viewed replaces it and both are sent side by side until dual_fire_until.
    replaced_by: contact_form_viewed
    dual_fire_until: 2026-12-18
    properties:
      - { name: location, type: string, example: contact_page, values: [contact_page] }
    fires_at:
      - page: /contact
        element: the contact form (the page loads)
        trigger: page_load
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: contact_form_started
    section: Contact and booking
    description: >-
      The first focus or edit of any contact form field, once per page view (startedRef). Not sent again for
      later fields, and not sent when the visitor never touches the form.
    question: What share of contact page visitors start the form, and how many of those finish it?
    track_via: client
    properties:
      - { name: location, type: string, example: contact_page, values: [contact_page] }
    fires_at:
      - page: /contact
        element: textbox "Name", "Work email", "Company website" or "How can I help you? Please share some context so that I can come prepared." (the first one focused or typed in)
        trigger: click
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Contact Form Started
    section: Contact and booking
    description: >-
      The Title Case name of contact_form_started: sent from the line next to it, at the same moment and with
      the same properties (see contact_form_started). Both are sent until 2026-12-18.
    question: What share of contact page visitors start the form, and how many of those finish it?
    track_via: client
    status: deprecated
    deprecated_reason: The 18 Nov 2026 rename to snake_case; contact_form_started replaces it and both are sent side by side until dual_fire_until.
    replaced_by: contact_form_started
    dual_fire_until: 2026-12-18
    properties:
      - { name: location, type: string, example: contact_page, values: [contact_page] }
    fires_at:
      - page: /contact
        element: textbox "Name", "Work email", "Company website" or "How can I help you? Please share some context so that I can come prepared." (the first one focused or typed in)
        trigger: click
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: contact_field_completed
    section: Contact and booking
    description: >-
      A contact form field loses focus with a non-empty trimmed value, once per field per page view. Not sent
      for a field left empty, and not again when the visitor later changes a field that already sent it. A
      field the visitor submits from with Enter, without leaving it, never sends it. pasted is true when
      anything was pasted into the field before it completed; autofill isn't a paste.
    question: Which contact form fields do visitors fill in, and where do they stop before submitting?
    track_via: client
    properties:
      - { name: field, type: string, example: name | email | website | goal, values: [name, email, website, goal] }
      - { name: char_count, type: numeric, example: "24", description: "Length of the trimmed value; never the text" }
      - { name: pasted, type: boolean, example: true | false }
      - { name: location, type: string, example: contact_page, values: [contact_page] }
    fires_at:
      - page: /contact
        element: textbox "Name", "Work email", "Company website" or "How can I help you? Please share some context so that I can come prepared." (leaving it with text in it, once per field)
        trigger: click
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Contact Field Completed
    section: Contact and booking
