      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: contact_lead_captured
    section: Contact and booking
    description: >-
      /api/contact's answer to a contact form submit, sent from the route through trackServer after the response,
      on the lead's profile (the browser's own Mixpanel id when the form sent one, else users.mixpanel_id, else the email's visitor id). status=success when the route
      accepted the lead, recorded it in email_submissions and answered 201 with the Calendly scheduling link.
      status=failed when it refused the submit with a 400: no name (name_required) or a missing or malformed
      email (invalid_email); the form's own checks refuse both before any request, so these come only from
      requests sent to the route directly, and a refusal with no email at all has no profile, so nothing is sent. An invalid JSON
      body and a request that never reaches the route send nothing. Only production sends, as for every
      trackServer event, so the /admin preview never does.
    question: How many leads did the contact form capture each week, and what share of them booked a call?
    track_via: server
    pair: contact_form_submitted
    properties:
      - { name: location, type: string, example: contact_page, values: [contact_page] }
      - { name: status, type: string, example: success | failed, values: [success, failed] }
      - { name: failure_reason, type: string, example: name_required | invalid_email, values: [name_required, invalid_email], only_when: status=failed }
      - { name: entry_point, type: string, example: ask | ask_answer, only_when: "the /contact URL the form was on carried a ?source of lower-case letters, digits and underscores (the form posts it as entryPoint)", description: "The /contact URL's ?source, as on contact_form_viewed" }
      - { name: email, type: string, example: you@company.com, description: "The lead's email, lower-cased; added by trackServer (the team sends email on lead events, .datalyze/context.md)" }
    fires_at:
      - page: /contact
        element: button "Pick a time →"
        trigger: server
        api: POST /api/contact
        needs: [Name filled, a valid Work email]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
      - { date: 2026-11-20, ref: "branch main (audit F2)", change: "SEMANTICS: sent from /api/contact (server) instead of the browser, with status and failure_reason, so refused submits are counted too (filter status=success for leads). The browser's funnel properties (completed_fields, completed_count, completed_optional, time_to_first_input_ms, time_to_submit_ms) stay on contact_form_submitted and Contact Lead Captured. Added entry_point (audit F4)" }
  - name: Contact Lead Captured
    section: Contact and booking
    description: >-
      The browser's lead event: /api/contact accepted the lead (201 with a Calendly scheduling link). Sent in the
      browser after the response, after rememberVisitor identifies the browser and just before the redirect to
      Calendly (the redirect waits for its callback), with the same funnel properties as the submit plus the
      email. Not sent when the route answers with an error, the request fails, or the response has no
      scheduling link. contact_lead_captured, which replaces it, is sent by the route itself since 20 Nov 2026
      and counts refusals too; this one is sent until 2026-12-18.
    question: How many leads did the contact form capture each week, and what share of them booked a call?
    track_via: client
    status: deprecated
    deprecated_reason: The 18 Nov 2026 rename to snake_case; contact_lead_captured replaces it and both are sent side by side until dual_fire_until.
    replaced_by: contact_lead_captured
    dual_fire_until: 2026-12-18
    properties:
      - { name: location, type: string, example: contact_page, values: [contact_page] }
      - { name: completed_fields, type: array, example: "[name, email, goal]", description: "The fields the person left filled (blurred with a non-empty value) before submitting, in the order they were completed; a field submitted with Enter or autofilled without leaving it is not in it" }
      - { name: completed_count, type: numeric, example: "3", description: "How many fields are in completed_fields" }
      - { name: completed_optional, type: boolean, example: true | false, description: "The optional Company website field was filled at submit" }
      - { name: time_to_first_input_ms, type: numeric, example: "4210", description: "Form mount to the first focus or edit of a field, in the browser (performance.now)" }
      - { name: time_to_submit_ms, type: numeric, example: "38250", description: "Form mount to the submit, in the browser (performance.now)" }
      - { name: email, type: string, example: you@company.com, description: "The lead's email, lower-cased (the team sends email on lead events, .datalyze/context.md)" }
    fires_at:
      - page: /contact
        element: button "Pick a time →"
        trigger: after_api
        api: POST /api/contact
        needs: [Name filled, a valid Work email]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
      - { date: 2026-11-20, ref: "branch main (audit F2)", change: "Description rewritten: contact_lead_captured is now sent from /api/contact, so this is no longer its twin" }
  - name: contact_form_abandoned
    section: Contact and booking
    description: >-
      The visitor leaves /contact after starting the form and before a successful submit: tab close, reload or
      a full-page navigation (the pagehide event), once per page view, sent with sendBeacon. Not sent after a
      successful submit (the Calendly redirect), and not sent when the visitor leaves through an in-site link
      handled by the Next.js router, which unmounts the form without a pagehide.
    question: How many visitors start the contact form and leave without sending it, and how far do they get?
    track_via: client
    pair: contact_form_started
    properties:
      - { name: location, type: string, example: contact_page, values: [contact_page] }
      - { name: furthest_field, type: string, example: name | email | website | goal, values: [name, email, website, goal], description: "The furthest field down the form the visitor focused" }
      - { name: completed_fields, type: array, example: "[name, email]" }
      - { name: completed_count, type: numeric, example: "2" }
      - { name: time_on_form_ms, type: numeric, example: "61200", description: "Form mount to leaving the page, in the browser" }
    fires_at:
      - page: /contact
        element: leaving the page (closing the tab, reloading, or a full-page navigation) after focusing or typing in a field, before a successful submit
        trigger: click
        needs: [the form started]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Contact Form Abandoned
    section: Contact and booking
