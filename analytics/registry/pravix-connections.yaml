      - { name: status, type: string, example: success, values: [success] }
      - { name: eventsDiscovered, type: numeric, example: "42 | 0" }
      - { name: userPropertiesDiscovered, type: numeric, example: "18 | 0" }
      - { name: lookbackDays, type: numeric, example: "3" }
      - { name: triggerType, type: string, example: verification | manual, values: [verification, manual, system] }
      - { name: mode, type: string, example: chunked, values: [chunked] }
    fires_at:
      - page: /connection-status/[id]
        element: button "Verify Connection" (the sync runs after the verify response)
        trigger: server
        api: POST /api/v1/connections/[connectionId]/verify
        needs: [signed_in, verification_succeeds]
      - page: /data-settings
        element: button "Run Sync"
        trigger: server
        api: POST /api/v1/data-settings/sync
        needs: [signed_in, connection_status=verified]
      - page: /data-settings
        element: none (the cloud worker's last export chunk reports; chunked mode)
        trigger: server
        api: POST /api/v1/internal/pubsub/completion
        needs: [chunked_sync_running]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Schema Sync Failed
    section: Pravix connections and data settings
    status: deprecated
    deprecated_reason: Folded into schema_sync_completed as status=failed on 18 Nov 2026.
    replaced_by: schema_sync_completed
    dual_fire_until: 2026-12-18
    description: >-
      The Title Case failure twin of schema_sync_completed (status=failed), sent beside it on every failure
      path until 2026-12-18. errorMessage is the raw error text; failurePhase is set only on the raw_export and
      reaped paths.
    question: How many schema syncs fail?
    track_via: server
    properties:
      - { name: connectionId, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: projectId, type: string, example: "2317312" }
      - { name: accountId, type: string, example: 0b6f3c2e-8a41-4d7e-9f15-2c7a9e4b1d03 }
      - { name: errorMessage, type: string, example: "Reaped: sync stuck in running state | BigQuery project ID is not configured" }
      - { name: failurePhase, type: string, example: raw_export | reaped, values: [raw_export, reaped] }
      - { name: lookbackDays, type: numeric, example: "3" }
      - { name: triggerType, type: string, example: verification | manual, values: [verification, manual, system] }
      - { name: minutesStuck, type: numeric, example: "15", only_when: failurePhase=reaped }
      - { name: chunkDate, type: string, example: "2026-11-15", only_when: failurePhase=raw_export }
      - { name: mode, type: string, example: chunked, values: [chunked] }
    fires_at:
      - page: /connection-status/[id]
        element: button "Verify Connection" (the sync runs after the verify response)
        trigger: server
        api: POST /api/v1/connections/[connectionId]/verify
        needs: [signed_in, verification_succeeds]
      - page: /data-settings
        element: button "Run Sync"
        trigger: server
        api: POST /api/v1/data-settings/sync
        needs: [signed_in, connection_status=verified]
      - page: /data-settings
        element: none (the cloud worker reports a failed export chunk, or the last chunk's catalog build fails)
        trigger: server
        api: POST /api/v1/internal/pubsub/completion
        needs: [chunked_sync_running]
      - page: /data-settings
