      - { name: accountId, type: string, example: 0b6f3c2e-8a41-4d7e-9f15-2c7a9e4b1d03 }
    fires_at:
      - page: /connections
        element: none (no button calls handleDelete; send DELETE /api/v1/connections/[connectionId] directly)
        trigger: server
        api: DELETE /api/v1/connections/[connectionId]
        needs: [signed_in, connection_exists]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: connection_verified
    section: Pravix connections and data settings
    description: >-
      POST /api/v1/connections/:connectionId/verify tested the connection against Mixpanel or PostHog. Sent
      from the Pravix server once per verify request: status=success after the connection is marked verified
      (the schema sync then starts after the response); status=failed when the test returns false
      (unexpected_result) or the analytics API throws a ServiceError (upstream_error), after the connection is
      marked failed. Not sent for an unknown or another account's connection (404), or when a non-ServiceError
      makes the route answer 500.
    question: What share of new connections verify, on which source and region, and why do the rest fail?
    track_via: server
    properties:
      - { name: connection_id, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: connection_source, type: string, example: mixpanel | posthog, values: [mixpanel, posthog] }
      - { name: project_id, type: string, example: "2317312" }
      - { name: account_id, type: string, example: 0b6f3c2e-8a41-4d7e-9f15-2c7a9e4b1d03 }
      - { name: status, type: string, example: success | failed, values: [success, failed] }
      - { name: failure_reason, type: string, example: upstream_error | unexpected_result, values: [unexpected_result, upstream_error], only_when: status=failed }
      - { name: error_code, type: numeric, example: "401 | 403 | 429 | 502", description: "The HTTP status the route answers with, mapped from the analytics API's status (502 when it has none)", only_when: status=failed }
    fires_at:
      - page: /connection-status/[id]
        element: button "Verify Connection" (a pending connection)
        trigger: server
        api: POST /api/v1/connections/[connectionId]/verify
        needs: [signed_in, connection_status=pending]
      - page: /connection-status/[id]
        element: button "Retry Verification" (a failed connection)
        trigger: server
        api: POST /api/v1/connections/[connectionId]/verify
        needs: [signed_in, connection_status=failed]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Connection Verified
    section: Pravix connections and data settings
    status: deprecated
    deprecated_reason: Renamed to snake_case on 18 Nov 2026, with the failures folded in as status=failed.
    replaced_by: connection_verified
    dual_fire_until: 2026-12-18
    description: >-
      The Title Case success twin of connection_verified (status=success), sent beside it after the
      connection is marked verified, until 2026-12-18. Failures went to Connection Verification Failed.
    question: How many connections verify?
    track_via: server
    properties:
      - { name: connectionId, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: projectId, type: string, example: "2317312" }
      - { name: status, type: string, example: verified, values: [verified] }
    fires_at:
      - page: /connection-status/[id]
        element: button "Verify Connection" (a pending connection)
        trigger: server
        api: POST /api/v1/connections/[connectionId]/verify
        needs: [signed_in, connection_status=pending]
      - page: /connection-status/[id]
        element: button "Retry Verification" (a failed connection)
        trigger: server
        api: POST /api/v1/connections/[connectionId]/verify
        needs: [signed_in, connection_status=failed]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Connection Verification Failed
    section: Pravix connections and data settings
    status: deprecated
    deprecated_reason: Folded into connection_verified as status=failed on 18 Nov 2026.
    replaced_by: connection_verified
    dual_fire_until: 2026-12-18
    description: >-
      The Title Case failure twin of connection_verified (status=failed), sent on both failure branches of the
      verify route until 2026-12-18. errorMessage is the friendly message the route shows; source overwrites the
      wrapper's source=server.
    question: How many connection verifications fail, and why?
    track_via: server
    properties:
      - { name: connectionId, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: source, type: string, example: mixpanel | posthog, values: [mixpanel, posthog] }
      - { name: projectId, type: string, example: "2317312" }
      - { name: accountId, type: string, example: 0b6f3c2e-8a41-4d7e-9f15-2c7a9e4b1d03 }
      - { name: errorCode, type: numeric, example: "401 | 403 | 429 | 502" }
      - { name: errorMessage, type: string, example: "We could not verify your analytics connection. Please review your credentials and try again." }
    fires_at:
      - page: /connection-status/[id]
        element: button "Verify Connection" (a pending connection)
        trigger: server
        api: POST /api/v1/connections/[connectionId]/verify
        needs: [signed_in, connection_status=pending]
      - page: /connection-status/[id]
        element: button "Retry Verification" (a failed connection)
        trigger: server
        api: POST /api/v1/connections/[connectionId]/verify
        needs: [signed_in, connection_status=failed]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: schema_sync_started
    section: Pravix connections and data settings
    description: >-
      A schema sync of the connection's recent events and properties began, after its sync row was written as
      running. Sent from the Pravix server inside syncRecentSchemaInline (mode=inline) or startChunkedSync
      (mode=chunked), with the account owner as the person. Not sent when the connection is missing or the
      account has no owner. A sync starts after a successful verification (trigger_type=verification) or from
      Run Sync on Data Settings (trigger_type=manual).
    question: How many schema syncs start, from verification or a manual Run Sync, and how many finish?
    track_via: server
    pair: schema_sync_completed
    properties:
      - { name: account_id, type: string, example: 0b6f3c2e-8a41-4d7e-9f15-2c7a9e4b1d03 }
      - { name: connection_id, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: project_id, type: string, example: "2317312" }
      - { name: lookback_days, type: numeric, example: "3" }
      - { name: trigger_type, type: string, example: verification | manual, values: [verification, manual, system] }
      - { name: mode, type: string, example: chunked | inline, values: [inline, chunked] }
    fires_at:
      - page: /connection-status/[id]
        element: button "Verify Connection" (the sync starts after the verify response)
        trigger: server
        api: POST /api/v1/connections/[connectionId]/verify
        needs: [signed_in, verification_succeeds]
      - page: /data-settings
        element: button "Run Sync"
        trigger: server
        api: POST /api/v1/data-settings/sync
        needs: [signed_in, connection_status=verified]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Schema Sync Started
    section: Pravix connections and data settings
    status: deprecated
    deprecated_reason: Renamed to snake_case on 18 Nov 2026.
    replaced_by: schema_sync_started
    dual_fire_until: 2026-12-18
    description: >-
      The Title Case twin of schema_sync_started, sent beside it until 2026-12-18. The inline path sends no
      mode; the chunked path sends mode=chunked. Sent through trackWithUser, so it carries no accountId.
    question: How many schema syncs start?
    track_via: server
    pair: Schema Sync Completed
    properties:
      - { name: connectionId, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: projectId, type: string, example: "2317312" }
      - { name: lookbackDays, type: numeric, example: "3" }
      - { name: triggerType, type: string, example: verification | manual, values: [verification, manual, system] }
      - { name: mode, type: string, example: chunked, values: [chunked] }
    fires_at:
      - page: /connection-status/[id]
        element: button "Verify Connection" (the sync starts after the verify response)
        trigger: server
        api: POST /api/v1/connections/[connectionId]/verify
        needs: [signed_in, verification_succeeds]
      - page: /data-settings
        element: button "Run Sync"
        trigger: server
        api: POST /api/v1/data-settings/sync
        needs: [signed_in, connection_status=verified]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: schema_sync_completed
    section: Pravix connections and data settings
    description: >-
      A schema sync reached its end. status=success once the catalog is saved and the sync row is marked
      success: inline (syncRecentSchemaInline, also when no analyzable events were found) or chunked
      (startChunkedSync with no events, or completeChunkedSync after every export chunk reported). status=failed
      when the sync row is marked failed: an inline error (sync_error), a chunked error before the fan-out
      (pre_barrier) or while building the catalog (post_barrier), an export chunk that exhausted its retries
      (raw_export, from the Pub/Sub completion handler), or the 15-minute reaper finding it stuck (reaped). Not
      sent when the chunked sync is still running, or when the sync failed before its row was written.
    question: How many schema syncs finish, how many fail and at which phase, and how many events and properties do they find?
    track_via: server
    pair: schema_sync_started
    properties:
      - { name: account_id, type: string, example: 0b6f3c2e-8a41-4d7e-9f15-2c7a9e4b1d03 }
      - { name: connection_id, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: project_id, type: string, example: "2317312" }
      - { name: status, type: string, example: success | failed, values: [success, failed] }
      - { name: failure_reason, type: string, example: sync_error | raw_export | reaped, values: [sync_error, pre_barrier, post_barrier, raw_export, reaped], only_when: status=failed }
      - { name: events_discovered, type: numeric, example: "42 | 0", only_when: status=success }
      - { name: user_properties_discovered, type: numeric, example: "18 | 0", only_when: status=success }
      - { name: lookback_days, type: numeric, example: "3" }
      - { name: trigger_type, type: string, example: verification | manual, values: [verification, manual, system] }
      - { name: mode, type: string, example: chunked | inline, values: [inline, chunked] }
      - { name: minutes_stuck, type: numeric, example: "15", only_when: failure_reason=reaped }
      - { name: chunk_date, type: string, example: "2026-11-15", description: "The start date of the export day-slice that failed", only_when: failure_reason=raw_export }
    fires_at:
      - page: /connection-status/[id]
        element: button "Verify Connection" (the sync runs after the verify response)
        trigger: server
        api: POST /api/v1/connections/[connectionId]/verify
        needs: [signed_in, verification_succeeds]
      - page: /data-settings
        element: button "Run Sync"
        trigger: server
        api: POST /api/v1/data-settings/sync
        needs: [signed_in, connection_status=verified]
      - page: /data-settings
        element: none (the cloud worker's last export chunk reports; chunked mode)
        trigger: server
        api: POST /api/v1/internal/pubsub/completion
        needs: [chunked_sync_running]
      - page: /data-settings
        element: none (Cloud Scheduler calls the reaper every 15 minutes)
        trigger: server
        api: POST /api/v1/internal/runs/reap
        needs: [sync_stuck_running]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Schema Sync Completed
    section: Pravix connections and data settings
    status: deprecated
    deprecated_reason: Renamed to snake_case on 18 Nov 2026.
    replaced_by: schema_sync_completed
    dual_fire_until: 2026-12-18
    description: >-
      The Title Case success twin of schema_sync_completed (status=success), sent beside it until 2026-12-18.
      The paths sent through trackForAccount carry accountId; the inline events-found path (trackWithUser)
