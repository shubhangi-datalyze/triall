      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: data_settings_saved
    section: Pravix connections and data settings
    description: >-
      PUT /api/v1/data-settings saved the person's include/exclude choices for the account's events, event
      properties and user properties. Sent from the Pravix server after updateDataSettings resolves, before the
      response. Data Settings only sends the rows that changed, and doesn't send the request when nothing
      changed. The counts are of rows in this save; total_excluded counts the rows this save set to excluded,
      not the account's total. Not sent when the save fails (500).
    question: How often do accounts tune what Pravix monitors, and do they exclude more than they include?
    track_via: server
    properties:
      - { name: account_id, type: string, example: 0b6f3c2e-8a41-4d7e-9f15-2c7a9e4b1d03 }
      - { name: events_changed, type: numeric, example: "3 | 0" }
      - { name: event_properties_changed, type: numeric, example: "5 | 0" }
      - { name: user_properties_changed, type: numeric, example: "1 | 0" }
      - { name: total_excluded, type: numeric, example: "4 | 0", description: "Rows in this save set to excluded" }
    fires_at:
      - page: /data-settings
        element: button "Save Changes"
        trigger: server
        api: PUT /api/v1/data-settings
        needs: [signed_in, settings_changed, no_sync_running]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Data Settings Saved
