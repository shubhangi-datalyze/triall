    description: The Title Case twin of data_settings_saved, sent beside it from the same handler until 2026-12-18.
    question: How often do accounts tune what Pravix monitors?
    track_via: server
    properties:
      - { name: accountId, type: string, example: 0b6f3c2e-8a41-4d7e-9f15-2c7a9e4b1d03 }
