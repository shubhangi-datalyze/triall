  - name: data_exclusion_toggled
    section: Pravix connections and data settings
    description: >-
      POST /api/v1/data-settings/exclude excluded (excluded=true) or re-included (excluded=false, the Undo) one
      event, a property on one event, a property on all events, or a user property, by name, from a detector's
      report row. Sent from the Pravix server after excludeByName resolves. Not sent when validation rejects
      the request (400) or the write fails (500). Toggles on the Data Settings page send data_settings_saved
      instead.
    question: Which alerts make people stop monitoring an event or property, and how often do they undo it?
    track_via: server
    properties:
      - { name: account_id, type: string, example: 0b6f3c2e-8a41-4d7e-9f15-2c7a9e4b1d03 }
      - { name: scope, type: string, example: property_on_event | event, values: [event, property_on_event, property_all_events, user_property] }
      - { name: event_name, type: string, example: Signup Completed, description: "The excluded event's name in the customer's analytics tool", only_when: scope is not user_property }
      - { name: property_name, type: string, example: utm_source, only_when: scope=property_on_event|property_all_events|user_property }
      - { name: excluded, type: boolean, example: "true | false" }
      - { name: entry_point, type: string, example: report, values: [report] }
    fires_at:
      - page: /reports/[runId]/[detectorId]
        element: button "Stop event" (the confirm dialog that the menu item "Stop the [event] event entirely" opens)
        trigger: server
        api: POST /api/v1/data-settings/exclude
        needs: [signed_in, report_has_alert_row]
      - page: /reports/[runId]/[detectorId]
        element: menuitem "Stop <property> on this event"
        trigger: server
        api: POST /api/v1/data-settings/exclude
        needs: [signed_in, alert_row_has_property]
      - page: /reports/[runId]/[detectorId]
        element: menuitem "Stop <property> on all events"
        trigger: server
        api: POST /api/v1/data-settings/exclude
        needs: [signed_in, alert_row_has_property]
      - page: /reports/[runId]/[detectorId]
        element: menuitem "Stop the <property> user property"
        trigger: server
        api: POST /api/v1/data-settings/exclude
        needs: [signed_in, alert_row_is_user_property]
      - page: /reports/[runId]/[detectorId]
        element: button "Undo" (after an exclusion)
        trigger: server
        api: POST /api/v1/data-settings/exclude
        needs: [signed_in, exclusion_just_applied]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
