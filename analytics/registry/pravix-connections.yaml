events:
  - name: connection_created
    section: Pravix connections and data settings
    description: >-
      POST /api/v1/connections saved a new Mixpanel or PostHog connection for the account (status pending,
      not yet verified). Sent from the Pravix server right after storage.createConnection resolves, before the
      201 response. Not sent when the request is rejected (an unsupported source or region, missing project id,
      invalid credentials, or the account already has its one connection) or when the insert fails; those
      requests send nothing. Editing a connection (PUT) does not send it.
    question: How many accounts connect an analytics source each week, which source and region do they pick, and how many go on to verify it?
    track_via: server
    properties:
      - { name: account_id, type: string, example: 0b6f3c2e-8a41-4d7e-9f15-2c7a9e4b1d03 }
      - { name: connection_id, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: connection_source, type: string, example: mixpanel | posthog, values: [mixpanel, posthog] }
      - { name: project_id, type: string, example: "2317312", description: "The analytics tool's project id the person typed" }
      - { name: region, type: string, example: us | eu | india, values: [us, eu, india] }
    fires_at:
      - page: /connections
        element: button "Connect & Verify" (the new-connection form)
        trigger: server
        api: POST /api/v1/connections
        needs: [signed_in, no_existing_connection]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Connection Created
    section: Pravix connections and data settings
    status: deprecated
    deprecated_reason: Renamed to snake_case on 18 Nov 2026; source overwrote the server's source super property.
    replaced_by: connection_created
    dual_fire_until: 2026-12-18
    description: >-
      The Title Case twin of connection_created, sent beside it from the same line until 2026-12-18.
      Its source property (mixpanel or posthog) overwrites the wrapper's source=server.
    question: How many accounts connect an analytics source each week?
    track_via: server
    properties:
      - { name: connectionId, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: source, type: string, example: mixpanel | posthog, values: [mixpanel, posthog] }
      - { name: projectId, type: string, example: "2317312" }
      - { name: region, type: string, example: us | eu | india, values: [us, eu, india] }
    fires_at:
      - page: /connections
        element: button "Connect & Verify" (the new-connection form)
        trigger: server
        api: POST /api/v1/connections
        needs: [signed_in, no_existing_connection]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: connection_deleted
    section: Pravix connections and data settings
    description: >-
      DELETE /api/v1/connections/:connectionId removed the account's connection. Sent from the Pravix server
      after storage.deleteConnection resolves, before the 204. Not sent for a missing connection (404) or another
      account's (403). The Connections page has no delete button today (its handleDelete is never rendered),
      so only a direct API call reaches it.
    question: How many accounts remove their analytics connection, and which source were they on?
    track_via: server
    properties:
      - { name: connection_id, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: connection_source, type: string, example: mixpanel | posthog, values: [mixpanel, posthog] }
      - { name: account_id, type: string, example: 0b6f3c2e-8a41-4d7e-9f15-2c7a9e4b1d03 }
    fires_at:
      - page: /connections
        element: none (no button calls handleDelete; send DELETE /api/v1/connections/[connectionId] directly)
        trigger: server
        api: DELETE /api/v1/connections/[connectionId]
        needs: [signed_in, connection_exists]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Connection Deleted
    section: Pravix connections and data settings
    status: deprecated
    deprecated_reason: Renamed to snake_case on 18 Nov 2026; source overwrote the server's source super property.
    replaced_by: connection_deleted
    dual_fire_until: 2026-12-18
    description: >-
      The Title Case twin of connection_deleted, sent beside it from the same handler until 2026-12-18.
      Its source property overwrites the wrapper's source=server.
    question: How many accounts remove their analytics connection?
    track_via: server
    properties:
      - { name: connectionId, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
