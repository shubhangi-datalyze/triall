      inputs give a sample size (the button does nothing otherwise). Replaces AB Calculator Plan Used, sent beside
      it until 2026-12-18.
    question: How many visitors who plan a test carry the plan over to check its result?
    track_via: client
    properties:
      - { name: per_version, type: numeric, example: "31234", description: "Visitors needed per version" }
      - { name: weeks, type: numeric, example: "7 | 1", only_when: "Weekly visitors holds a number above 0", description: "Weeks the test needs at the weekly visitors entered" }
    fires_at:
      - page: /tools/ab-test-calculator
        element: button "Use this plan to check the result" (the Plan a test tab)
        trigger: click
        needs: [valid plan inputs]
    changelog:
