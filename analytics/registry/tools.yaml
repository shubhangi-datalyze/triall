events:
  - name: tool_email_submitted
    section: Free tools
    description: >-
      /api/tool-downloads' answer to a free tool's email gate, sent from the route through trackServer after the
      response, on the visitor's profile (the browser's own Mixpanel id when the form sent one, else users.mixpanel_id, else the email's visitor id): from the download form
      on the downloadable tools' pages and from the Analytics Maturity Grader's gate. status=success when the
      route stored the download row, recorded the email in email_submissions and answered 201. status=failed when
      the email is missing or malformed (invalid_email, 400; a blank email has no profile, so nothing is sent) or
      storing the row failed (db_error, 503). A request naming an unknown tool (400; the site's forms always name
      a known one) and an invalid JSON body send nothing. Replaces Email Submitted, the browser's event, sent
      beside it until 2026-12-18.
    question: How many leads do the free tools capture each week, from which tool, and how many fail?
    track_via: server
    properties:
      - { name: tool_id, type: string, example: "mixpanel-exporter | mixpanel-users-exporter | event-tracking-plan-generator | analytics-strategy-creator | analytics-maturity-grader", values: [mixpanel-exporter, mixpanel-users-exporter, event-tracking-plan-generator, analytics-strategy-creator, analytics-maturity-grader], description: "The tool's id from content/tools.json (lib/data/tool-config.ts)" }
      - { name: status, type: string, example: success | failed, values: [success, failed] }
      - { name: failure_reason, type: string, example: invalid_email | db_error, values: [invalid_email, db_error], only_when: status=failed }
      - { name: email, type: string, example: you@company.com, description: "The email the visitor typed, trimmed and lower-cased; added by trackServer (the team sends email on lead events, .datalyze/context.md)" }
    fires_at:
      - page: /tools/[toolId]
        element: button "Download the tool" (the email form on the Mixpanel Event Exporter and Mixpanel Users Exporter pages)
        trigger: server
        api: POST /api/tool-downloads
      - page: /tools/event-tracking-plan-generator
        element: button "Download the tool"
        trigger: server
        api: POST /api/tool-downloads
      - page: /tools/analytics-strategy-creator
        element: button "Download the tool"
        trigger: server
        api: POST /api/tool-downloads
      - page: /tools/analytics-maturity-grader
        element: button "Grade my analytics" (the email gate before the quiz)
        trigger: server
        api: POST /api/tool-downloads
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
      - { date: 2026-11-20, ref: "branch main (audit F3)", change: "SEMANTICS: sent from /api/tool-downloads (server) instead of the browser, with status and failure_reason, so refused and failed submits are counted too (filter status=success for leads)" }
  - name: Email Submitted
    section: Free tools
    status: deprecated
    deprecated_reason: Renamed to snake_case object_action in the 18 Nov 2026 rename
    replaced_by: tool_email_submitted
    dual_fire_until: 2026-12-18
    description: >-
      The browser's lead event for the free tools: sent from the download form and the Maturity Grader's gate once
      /api/tool-downloads accepted the email (201), after rememberVisitor identifies the browser. Not sent when
      the route rejects the email or the tool id (400), when storing the row fails (503), or when the request
      fails. tool_email_submitted, which replaces it, is sent by the route itself since 20 Nov 2026; this one is
      sent until 2026-12-18.
    question: How many leads do the free tools capture each week, and from which tool?
    track_via: client
    properties:
      - { name: tool_id, type: string, example: "mixpanel-exporter | mixpanel-users-exporter | event-tracking-plan-generator | analytics-strategy-creator | analytics-maturity-grader", values: [mixpanel-exporter, mixpanel-users-exporter, event-tracking-plan-generator, analytics-strategy-creator, analytics-maturity-grader] }
      - { name: email, type: string, example: you@company.com }
    fires_at:
      - page: /tools/[toolId]
        element: button "Download the tool" (the email form on the Mixpanel Event Exporter and Mixpanel Users Exporter pages)
        trigger: after_api
        api: POST /api/tool-downloads
      - page: /tools/event-tracking-plan-generator
        element: button "Download the tool"
        trigger: after_api
        api: POST /api/tool-downloads
      - page: /tools/analytics-strategy-creator
        element: button "Download the tool"
        trigger: after_api
        api: POST /api/tool-downloads
      - page: /tools/analytics-maturity-grader
