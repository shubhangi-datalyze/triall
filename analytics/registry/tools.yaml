      Plan tab on load. Replaces AB Calculator Tab Switched, sent beside it until 2026-12-18.
    question: How many calculator visitors move to planning a test rather than only checking a result?
    track_via: client
    properties:
      - { name: tab, type: string, example: plan | check, values: [check, plan], description: "The tab the visitor switched to" }
    fires_at:
