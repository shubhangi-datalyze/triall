        trigger: after_api
        api: POST /api/tool-downloads
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
      - { date: 2026-11-20, ref: "branch main (audit F3)", change: "Description rewritten: tool_email_submitted is now sent from /api/tool-downloads, so this is no longer its twin" }
  - name: ab_calculator_result
    section: Free tools
    description: >-
      The A/B test calculator's Check a result tab shows a verdict for numbers the visitor entered. Sent in the
      browser 2 seconds after the verdict or one of the four result inputs (visitors and conversions for A and B)
      last changed, so typing settles into one event. Only after the visitor's own input (a field, or Use this
      plan): never for the page's worked example on load or for a shared link's values. Not sent while the inputs
      are invalid (no verdict shown), and not when only confidence, sides or test details change without
      changing the verdict. Replaces AB Calculator Result, sent beside it until 2026-12-18.
    question: How many visitors check a real A/B result each week, and what verdicts do they get?
    track_via: client
    properties:
      - { name: verdict, type: string, example: ship | keepRunning | noDifference | keepA | dontTrust, values: [ship, keepRunning, noDifference, keepA, dontTrust] }
      - { name: significant, type: boolean, example: "true | false" }
      - { name: example, type: boolean, example: "false | true", description: "True when the four result inputs still hold the page's worked example (10,000/500 vs 10,000/560)" }
      - { name: confidence, type: string, example: "95 | 90 | 99", description: "The confidence level in percent, sent as the text of the field (the selector offers 90, 95, 99; a shared link can carry another)" }
      - { name: sided, type: string, example: two | one, values: [one, two] }
      - { name: has_plan, type: boolean, example: "false | true", description: "True when the planned visitors per version field holds a number" }
      - { name: failed_checks, type: array, example: "[] | [planned] | [split, duration]", description: "The ids of the data checks that failed or are on hold; each is split, planned, duration or conversions; empty when every check passes" }
    fires_at:
      - page: /tools/ab-test-calculator
        element: textbox "Visitors" / "Conversions" for version A or B (the Check a result tab), 2 seconds after the last change
        trigger: click
        needs: [valid result inputs]
        from: "Not a click on a button: type a new value into any of the four result inputs and wait 2 seconds; the verdict is computed in the browser, with no request."
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
