      quiz opens only after the email gate). The score is computed in the browser; the event is sent on the click,
      before the results page opens. Not sent while any question is unanswered (the button is disabled). Replaces
      Maturity Grader Submitted, sent beside it until 2026-12-18.
    question: How many visitors who give their email finish the maturity quiz, and what grades do they get?
    track_via: client
    pair: tool_email_submitted
    properties:
      - { name: overall_score, type: numeric, example: "143 | 250 | 20", description: "Points out of 250 (ten questions, 2 to 25 points each)" }
      - { name: overall_grade, type: string, example: B | C+ | A+, values: [A+, A, B+, B, C+, C, D, F] }
    fires_at:
