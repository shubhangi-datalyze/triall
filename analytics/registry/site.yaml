events:
  - name: cta_button_clicked
    section: Marketing site
    description: >-
      A visitor clicks a CtaButton (app/_components/cta-button.tsx): the "Book a call" buttons into /contact on the
      home, service, industry, about, case-study, resources and tool pages and in the header, the "Get started" buttons
      into /account/signup on /tracking-agent, /mcp, /pravix and /alerting, and the few CtaButtons that only move
      inside the site (the home method steps, the home problem panels' links into service pages, "See how we did it"),
      and the plain-looking links into /contact: the mobile menu's Contact link, the footer's Contact and Book a Call
      links and its email link, the book-a-call box after blog posts that have no call to action of their own, and
      the blog post body's buttons that link to a page on this site. Sent in the browser on the click, before the
      navigation; it is intent, not a booking or a sign-up. Not sent by Sign in, the header's and menu's page links,
      or links to other sites. Sent next to CTA Clicked until 2026-12-18.
    question: Which calls to action bring visitors to /contact and to sign-up, from which page and placement?
    track_via: client
    properties:
      - { name: cta_text, type: string, example: "Book a call | Book a Call | Get started | Get your first run free | Request a custom tool | Book a free analytics audit", description: "The button's label as the page shows it (from content/*.json): the text of the label, also when it is wrapped in an element (the blog box's span)" }
      - { name: location, type: string, example: "nav_header | nav_mobile | nav_mobile_contact | home_hero | home_why_us | home_method_1 | tracking_agent_hero | service_mixpanel_final_cta | industry_saas_results | alerting_pricing_0 | ab_calculator_ship | footer_contact | footer_book_call | footer_email | blog_post_end | blog_post_body", description: "Which button: a fixed name per call site, or <page>_hero | <page>_results | <page>_final_cta | <page>_pricing_<n> where <page> is home | service_<tool> | service_audit | industry_<industry> | tracking_agent | mcp | pravix | alerting" }
      - { name: destination, type: string, example: "/contact | /account/signup | mailto:ansh@joindatalyze.com | /services/analytics-audit", description: "Where the button goes: its href as the page gives it, without the query string or fragment" }
    fires_at:
