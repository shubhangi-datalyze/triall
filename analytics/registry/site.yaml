  - name: home_problem_opened
    section: Marketing site
    description: >-
      A visitor opens one of the problem bubbles in the homepage's "What teams come to us with" section (WhyUs). Sent in
      the browser when the click opens an item. Not sent for the first item being open when the page loads, not on a
      desktop click on the item already open (nothing changes), and not when a mobile tap closes the open item.
      Sent next to Home Problem Opened until 2026-12-18.
    question: Which problems do homepage visitors open before they book a call?
    track_via: client
    properties:
      - { name: problem, type: string, example: "Revenue doesn't add up | We don't trust our data | GA4 and Mixpanel don't match", description: "The bubble's label, from content/home.json whyUs.items" }
      - { name: position, type: numeric, example: "2 | 3 | 1", description: "The bubble's place in the list, counting from 1" }
    fires_at:
      - page: /
        element: "button with the problem's label, e.g. \"Revenue doesn't add up\", under \"What teams come to us with\""
        trigger: click
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
