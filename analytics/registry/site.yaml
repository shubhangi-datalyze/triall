  - name: $mp_web_page_view
    section: Marketing site
    description: >-
      Every page load and every client-side route change on www and app.joindatalyze.com, sent by PageviewTracker
      (app/_components/mixpanel-provider.tsx, in the root layout) through trackPageview (lib/mixpanel.ts) when the path
      or the query string changes. Mixpanel's own autocapture page view is off, so this is the only one. Not sent on the
      secret-handling routes (/tracking-agent/start, /setup, /review, /dashboard, /github, /plan, /verify, /mcp/dashboard),
      in a tab holding a GitHub sign-in, or from hosts other than production (localhost only with
      NEXT_PUBLIC_MIXPANEL_SEND_LOCAL=1). One-time codes and tokens (?code=, ?state=, ?installation_id=, ?token=) are
      dropped from the URL; UTMs are kept. On the app host, Pravix (/pravix/*) sends it itself, with the same properties,
      from PageviewTracker (pravix/client/src/App.tsx) through trackPageview (pravix/client/src/lib/pageview.ts, sent by
      mixpanelDirect.ts) on load and on every route or query change; the SDK's own page view is off there too.
    question: How many visitors reach each page, from which source, and how many of them go on to /contact or sign-up?
    track_via: client
    properties:
      - { name: page, type: string, example: "/ | /tracking-agent | /services/analytics-audit | /contact?utm_source=linkedin", description: "The path plus the scrubbed query string" }
      - { name: current_domain, type: string, example: www.joindatalyze.com | app.joindatalyze.com }
      - { name: current_url_path, type: string, example: "/ | /tracking-agent | /blog/mixpanel-vs-amplitude/" }
      - { name: current_url_protocol, type: string, example: "https: | http: (localhost verification only)" }
      - { name: current_url_search, type: string, example: "?utm_source=linkedin&utm_medium=social", only_when: the URL has a query string, description: "The scrubbed query string with its leading ?; an empty string when the URL has none" }
      - { name: current_page_title, type: string, example: "Datalyze - Analytics & Growth Partner for Startups", description: "document.title when the page view is sent; pages with their own title use the template <page title> | Datalyze" }
    fires_at:
      - page: /
        element: "the page itself (any route of the site and app host)"
        trigger: page_load
      - page: /contact
        element: "the page itself"
        trigger: page_load
      - page: /tracking-agent
        element: "the page itself"
        trigger: page_load
      - page: /account/signup
        element: "the page itself"
        trigger: page_load
      - page: /pravix
        element: "the page itself (any Pravix route on the app host)"
        trigger: page_load
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
      - { date: 2026-11-25, ref: datalyze/fix-verify-20261125-1338-ef158a1, change: "Verification V1: Pravix on the app host sends it through trackPageview with page, current_url_search and the other site properties, instead of the SDK's own page view; fires_at /pravix added" }
