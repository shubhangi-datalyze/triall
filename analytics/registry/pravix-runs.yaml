  - name: detector_batch_submitted
    section: Pravix runs and detectors
    description: >-
      The Pravix server published a run's detector batch job to the cloud function (after enqueueBatchJobs
      resolves), from the inline path or after the chunk barrier. One per run, on the account owner. Not sent
      when no valid detectors are configured or the publish throws (then run_completed status=failed,
      failure_reason=batch_submission).
    question: How many detector batches are sent to the cloud function, with how many detectors, and how many come back?
    track_via: server
    properties:
      - { name: account_id, type: string, example: 719f7f5d-8de3-4ac0-be12-8f156cc8f00d }
      - { name: run_id, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: setup_id, type: string, example: a3e8a661-18b7-4a0e-94fc-1e65891a5cf3 }
      - { name: job_id, type: string, example: "a3e8a661-18b7-4a0e-94fc-1e65891a5cf3-5b48c62e-5484-4225-95d5-570d4cb45992-1763445731000" }
      - { name: detector_count, type: numeric, example: "5 | 9" }
      - { name: expected_detectors, type: array, example: "[event_count_spike, event_property_stopped_flowing, event_property_null_percentage_increased]" }
      - { name: dataset_id, type: string, example: dataguard_runs }
    fires_at:
      - element: the orchestrator after pre-processing, following a manual or scheduled start
        trigger: server
        api: POST /api/v1/setups/[setupId]/run
        needs: [a run started, at least one valid detector]
      - element: the last day-slice chunk result (barrier closes, then dispatch)
        trigger: server
        api: POST /api/v1/internal/pubsub/completion
        needs: [a run started in chunked mode, at least one valid detector]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
