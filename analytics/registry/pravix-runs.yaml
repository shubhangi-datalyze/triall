  - name: detector_completed
    section: Pravix runs and detectors
    description: >-
      One detector's outcome in a run, sent by the completion handler for every detector in the cloud
      function's completion message, after its report section is saved: status=success (with severity ok or
      alert), failed, or skipped (with the skip reason). Sent on the setup creator's distinct_id. Not sent at
      all when the setup creator's user can't be found, or when the setup or run is gone (the message is dropped).
    question: Which detectors find alerts, fail or skip most often, and why?
    track_via: server
    properties:
      - { name: run_id, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: setup_id, type: string, example: a3e8a661-18b7-4a0e-94fc-1e65891a5cf3 }
      - { name: account_id, type: string, example: 719f7f5d-8de3-4ac0-be12-8f156cc8f00d }
      - { name: use_case_key, type: string, example: event_count_spike | event_property_stopped_flowing | user_property_null_percentage_increased }
      - { name: execution_time_ms, type: numeric, example: "4210" }
      - { name: processed_events, type: numeric, example: "184220" }
      - { name: trigger_type, type: string, example: scheduled | manual, values: [manual, scheduled] }
      - { name: status, type: string, example: success | skipped | failed, values: [success, failed, skipped] }
      - { name: failure_reason, type: string, example: detector_error, values: [detector_error], only_when: status=failed }
      - { name: reason, type: string, example: insufficient-data | no-data | below-min-volume, values: [skip-flag, disabled, no-data, insufficient-data, below-min-volume, insufficient-baseline, skipped, other], only_when: status=skipped }
      - { name: severity, type: string, example: ok | alert, values: [ok, alert], only_when: status=success }
      - { name: alert, type: boolean, example: "false | true", only_when: status=success }
    fires_at:
      - element: the cloud function's completion message (one event per detector in it)
        trigger: server
        api: POST /api/v1/internal/pubsub/completion
        needs: [a detector batch submitted, the setup creator's user exists]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
