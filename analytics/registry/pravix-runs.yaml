  - name: run_preprocessing_completed
    section: Pravix runs and detectors
    description: >-
      A run's pre-processing finished and the detector batch is next. mode=inline when the orchestrator ran
      pre-processing in the request (after the succeeded stage log); mode=chunked when the last day-slice
      chunk reports and the barrier closes (after the dispatch claim is won). Sent on the account owner.
      Not sent when pre-processing fails (run_completed status=failed), while chunks are still in flight, or
      when the preprocess job reports no analyzable events and dispatches detectors directly.
    question: How long does a run's data take to land, how much data is loaded per run, and inline or chunked?
    track_via: server
    properties:
      - { name: account_id, type: string, example: 719f7f5d-8de3-4ac0-be12-8f156cc8f00d }
      - { name: run_id, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: setup_id, type: string, example: a3e8a661-18b7-4a0e-94fc-1e65891a5cf3 }
      - { name: mode, type: string, example: chunked | inline, values: [inline, chunked] }
      - { name: use_case_count, type: numeric, example: "5" }
      - { name: max_lookback_days, type: numeric, example: "30" }
      - { name: chunk_count, type: numeric, example: "31", only_when: mode=chunked }
      - { name: total_events_loaded, type: numeric, example: "184220", only_when: mode=chunked }
      - { name: profile_chunk_count, type: numeric, example: "1", only_when: mode=chunked }
      - { name: total_profiles_loaded, type: numeric, example: "5120", only_when: mode=chunked }
    fires_at:
      - element: the last day-slice chunk result (barrier closes)
        trigger: server
        api: POST /api/v1/internal/pubsub/completion
        needs: [a run started in chunked mode]
      - element: the orchestrator after inline pre-processing, following a manual or scheduled start
        trigger: server
        api: POST /api/v1/setups/[setupId]/run
        needs: [a run started in inline mode]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
      - { date: 2026-11-23, ref: "branch verify/paths-and-sheet (verification V2)", change: "use_case_count and max_lookback_days now sent on mode=chunked too, from the setup's use cases loaded at the barrier" }
  - name: Run Preprocessing Completed
    section: Pravix runs and detectors
    status: deprecated
    deprecated_reason: Renamed to snake_case run_preprocessing_completed on 18 Nov 2026 (audit decision Q3); both are sent until the dual-fire date.
    replaced_by: run_preprocessing_completed
    dual_fire_until: 2026-12-18
