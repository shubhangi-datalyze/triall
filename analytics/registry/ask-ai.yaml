  - name: ask_ai_booking_clicked
    section: Ask AI
    description: >-
      A visitor clicks "Book a call" in Ask AI, which opens /contact?source=ask: under a finished answer, under a
      refusal, or in the limit notice after a 429. Sent in the browser on the click, before the contact page loads;
      the booking itself is the contact page's events. after_refusal is true only under a refusal, so the answer and
      the limit notice both send false.
    question: How many Ask AI visitors go on to book a call, and do refusals send more of them than answers?
    track_via: client
    properties:
      - { name: after_refusal, type: boolean, example: "true | false", description: "The link sat under a refusal; false under an answer and in the limit notice" }
    fires_at:
      - page: /ask
        element: link "Book a call" (after "Want this applied to your stack?" under an answer)
        trigger: click
      - page: /ask
        element: link "Book a call" (after "Want a straight answer on this?" under a refusal)
        trigger: click
      - page: /ask
        element: link "Book a call" (after "Or skip ahead -" in the limit notice)
        trigger: click
        needs: [a 429 from /api/ask]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
