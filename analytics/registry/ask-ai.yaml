events:
  - name: ask_ai_question_submitted
    section: Ask AI
    description: >-
      A visitor sends a question in the /ask chat: the Send button, Enter in the composer, or one of the starter
      questions on an empty chat. Sent in the browser by submit(), after the question is trimmed and found non-empty
      and before the request to /api/ask, so it counts every attempt, including questions the email gate then holds
      (401), the limits refuse (429) and answers that fail. Not sent for an empty question or while an answer is still
      streaming, and not sent again when a held question runs after the email gate.
    question: How many questions do visitors ask each week, and how many of them are a conversation's first question?
    track_via: client
    properties:
      - { name: question_length, type: numeric, example: "39 | 24 | 500", description: "Characters in the trimmed question (at most 500, the composer's maxLength); never the text" }
      - { name: is_first_question, type: boolean, example: "true | false", description: "The active conversation had no turns before this question" }
    fires_at:
      - page: /ask
        element: button "Send question"
        trigger: click
      - page: /ask
        element: textbox "Ask about analytics, tracking, retention, attribution…" (Enter without Shift)
        trigger: submit
      - page: /ask
        element: button "How do I set up Mixpanel the right way?" (a starter question on an empty chat)
        trigger: click
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Ask AI Question Submitted
    section: Ask AI
    status: deprecated
    deprecated_reason: Renamed to snake_case on 18 Nov 2026; sent beside ask_ai_question_submitted until dashboards move.
    replaced_by: ask_ai_question_submitted
    dual_fire_until: 2026-12-18
    description: >-
      The Title Case twin of ask_ai_question_submitted, sent on the line before it from the same submit() call in the
      /ask chat, with the same properties.
    question: How many questions do visitors ask each week, and how many of them are a conversation's first question?
    track_via: client
    properties:
      - { name: question_length, type: numeric, example: "39 | 24 | 500" }
      - { name: is_first_question, type: boolean, example: "true | false" }
    fires_at:
      - page: /ask
        element: button "Send question"
        trigger: click
      - page: /ask
        element: textbox "Ask about analytics, tracking, retention, attribution…" (Enter without Shift)
        trigger: submit
      - page: /ask
        element: button "How do I set up Mixpanel the right way?" (a starter question on an empty chat)
        trigger: click
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: ask_ai_quota_reached
    section: Ask AI
    description: >-
      /api/ask answered 429 to a question: the global daily cap (daily_cap) or the per-IP cap (ip_cap) fired, or the
      visitor's per-email quota is used up (quota_exhausted). Sent in the browser once the 429 body is read, after the
      question's turn is removed and the limit notice is shown. Not sent for a 401 (the email gate) or any other error,
      and the event does not say which of the three limits fired.
    question: How often do visitors hit a question limit, and after how many questions in the conversation?
    track_via: client
    pair: ask_ai_question_submitted
    properties:
      - { name: questions_asked, type: numeric, example: "0 | 2", description: "Turns in the active conversation before this question (priorTurns); 0 for a question held by the email gate. Not the visitor's total questions" }
    fires_at:
      - page: /ask
        element: button "Send question"
        trigger: after_api
        api: POST /api/ask
        needs: [ask_session_cookie, a limit reached (daily_cap, ip_cap or quota_exhausted)]
      - page: /ask
        element: button "Ask my question" (the email gate, with a held question)
        trigger: after_api
        api: POST /api/ask
        needs: [a limit reached (daily_cap, ip_cap or quota_exhausted)]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Ask AI Quota Reached
    section: Ask AI
    status: deprecated
    deprecated_reason: Renamed to snake_case on 18 Nov 2026; sent beside ask_ai_quota_reached until dashboards move.
    replaced_by: ask_ai_quota_reached
    dual_fire_until: 2026-12-18
    description: >-
      The Title Case twin of ask_ai_quota_reached, sent on the line before it when /api/ask answers 429, with the
      same property.
    question: How often do visitors hit a question limit, and after how many questions in the conversation?
    track_via: client
    properties:
      - { name: questions_asked, type: numeric, example: "0 | 2" }
    fires_at:
      - page: /ask
