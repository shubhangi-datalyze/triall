  - name: ask_ai_refused
    section: Ask AI
    description: >-
      The answer stream from /api/ask carried a refusal line: the gate found nothing good enough to answer from, or
      the generated answer failed validation and was retracted (a late refusal replaces text already shown), or a
      cached refusal was replayed. Sent in the browser when the refusal line is read, so it is not sent when the
      visitor stops the answer or leaves before the line arrives. Not sent for an answer, a 401, a 429 or a server
      error (the stream's error line).
    question: How often does Ask AI refuse to answer, and for which reason?
    track_via: client
    pair: ask_ai_question_submitted
    properties:
      - { name: refusal_reason, type: string, example: below_threshold | insufficient_context | bad_citation, values: [no_results, not_calibrated, below_threshold, flat_gap, insufficient_context, bad_citation, ungrounded_figure], description: "The reason the server's gate (evaluateGate) or answer check (validateAnswer) gave" }
    fires_at:
      - page: /ask
        element: button "Send question"
        trigger: after_api
        api: POST /api/ask
        needs: [ask_session_cookie]
      - page: /ask
        element: button "Ask my question" (the email gate, with a held question)
        trigger: after_api
        api: POST /api/ask
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Ask AI Refused
