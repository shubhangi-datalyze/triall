  - name: ask_ai_email_submitted
    section: Ask AI
    description: >-
      /api/ask/start's answer to the Ask AI email gate, sent from the route through trackServer after the response,
      on the visitor's profile (the browser's own Mixpanel id when the form sent one, else users.mixpanel_id, else the email's visitor id). status=success when the address
      passed the format check, the user row was upserted, the email went to email_submissions and the session
      cookie was set. status=failed when the email is missing or malformed (invalid_email, 400; a blank email has
      no profile, so nothing is sent) or the upsert failed (db_error, 500). An invalid JSON body sends nothing.
    question: How many visitors give their email to Ask AI each week, how many did so to get a held question answered, and how many fail?
    track_via: server
    properties:
      - { name: had_held_question, type: boolean, example: "true | false", description: "A question was waiting behind the gate (the chat posts it with the email after a 401 from /api/ask); false when the gate showed on arrival" }
      - { name: status, type: string, example: success | failed, values: [success, failed] }
      - { name: failure_reason, type: string, example: invalid_email | db_error, values: [invalid_email, db_error], only_when: status=failed }
      - { name: email, type: string, example: reader@example.com, description: "The email given at the gate, trimmed and lower-cased; added by trackServer (the team sends email on lead events, .datalyze/context.md)" }
    fires_at:
      - page: /ask
        element: button "Ask my question" (the email gate, after a question was held)
        trigger: server
        api: POST /api/ask/start
        needs: [no ask_session cookie]
      - page: /ask
        element: button "Start asking" (the email gate, shown on arrival)
        trigger: server
        api: POST /api/ask/start
        needs: [no ask_session cookie]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
      - { date: 2026-11-20, ref: "branch main (audit F3)", change: "SEMANTICS: sent from /api/ask/start (server) instead of the browser, with status and failure_reason, so refused and failed gates are counted too (filter status=success for leads)" }
  - name: Ask AI Email Submitted
    section: Ask AI
    status: deprecated
    deprecated_reason: Renamed to snake_case on 18 Nov 2026; sent beside ask_ai_email_submitted until dashboards move.
    replaced_by: ask_ai_email_submitted
    dual_fire_until: 2026-12-18
    description: >-
      The browser's Ask AI gate event, sent once /api/ask/start accepts the email, after rememberVisitor
      identifies the browser. Not sent on a 400 or 500, or when the request fails. ask_ai_email_submitted, which
      replaces it, is sent by the route itself since 20 Nov 2026; this one is sent until 2026-12-18.
    question: How many visitors give their email to Ask AI each week, and how many did so to get a held question answered?
    track_via: client
    properties:
      - { name: email, type: string, example: reader@example.com }
      - { name: had_held_question, type: boolean, example: "true | false" }
    fires_at:
      - page: /ask
        element: button "Ask my question" (the email gate, after a question was held)
        trigger: after_api
        api: POST /api/ask/start
        needs: [no ask_session cookie]
      - page: /ask
        element: button "Start asking" (the email gate, shown on arrival)
        trigger: after_api
        api: POST /api/ask/start
        needs: [no ask_session cookie]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
      - { date: 2026-11-20, ref: "branch main (audit F3)", change: "Description rewritten: ask_ai_email_submitted is now sent from /api/ask/start, so this is no longer its twin" }
  - name: ask_ai_citation_clicked
    section: Ask AI
    description: >-
      A visitor clicks a linked source in Ask AI: a source chip under a finished answer (only the sources the answer
      cited), or the "Closest thing I have" link under a refusal. Sent in the browser on the click, as the link
      navigates. Not sent for internal notes, which show unlinked as "from my notes", and the event does not say
      which of the two placements was clicked.
    question: Which of our posts and chapters do Ask AI answers send readers to, and of which kind?
    track_via: client
    properties:
      - { name: source_type, type: string, example: ghost | playbook | linkedin, values: [ghost, playbook, linkedin], description: "The kind of source: a blog post (ghost), a playbook chapter or a LinkedIn post. gdoc sources have no URL and can't be clicked" }
      - { name: source_url, type: string, example: "https://www.joindatalyze.com/playbook/<slug> | https://www.joindatalyze.com/blog/<slug>/ | https://www.linkedin.com/posts/<id>" }
    fires_at:
      - page: /ask
        element: link "<source title>" (a source chip under a finished answer)
        trigger: click
        needs: [an answer that cites a linked source]
      - page: /ask
        element: link "<nearest source title>" (after "Closest thing I have:" under a refusal)
        trigger: click
        needs: [a refusal with a linked nearest source]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
