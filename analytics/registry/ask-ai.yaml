    description: >-
      The Title Case twin of ask_ai_refused, sent on the line before it when the answer stream carries a refusal,
      with the same property.
    question: How often does Ask AI refuse to answer, and for which reason?
    track_via: client
    properties:
      - { name: refusal_reason, type: string, example: below_threshold | insufficient_context | bad_citation, values: [no_results, not_calibrated, below_threshold, flat_gap, insufficient_context, bad_citation, ungrounded_figure] }
    fires_at:
      - page: /ask
        element: button "Send question"
        trigger: after_api
