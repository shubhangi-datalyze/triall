  - name: ask_ai_new_chat
    section: Ask AI
    description: >-
      A visitor clicks New chat in the /ask sidebar or the "+" in the top bar while no answer is streaming. Sent in
      the browser on the click, whether it creates a conversation or only reopens an existing empty one. Not sent
      while an answer streams, and not sent when deleting the last chat starts a fresh one.
    question: How often do visitors start a second conversation in Ask AI?
    track_via: client
    properties: []
    fires_at:
      - page: /ask
        element: button "New chat" (the sidebar, "+ New chat")
        trigger: click
      - page: /ask
        element: button "New chat" (the "+" in the top bar)
        trigger: click
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Ask AI New Chat
    section: Ask AI
    status: deprecated
    deprecated_reason: Renamed to snake_case on 18 Nov 2026; sent beside ask_ai_new_chat until dashboards move.
    replaced_by: ask_ai_new_chat
    dual_fire_until: 2026-12-18
    description: >-
      The Title Case twin of ask_ai_new_chat, sent on the line before it from the same New chat click.
    question: How often do visitors start a second conversation in Ask AI?
    track_via: client
    properties: []
    fires_at:
      - page: /ask
        element: button "New chat" (the sidebar, "+ New chat")
