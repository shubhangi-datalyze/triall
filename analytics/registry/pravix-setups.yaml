events:
  - name: setup_wizard_started
    section: Pravix setups
    description: >-
      The setup wizard opened. Sent in the browser once when SetupWizard mounts (an effect with no
      dependencies), on /setup-wizard (the onboarding route Connection Status's Continue to Setup opens),
      /setups/new, or /setups/:setupId/edit. Not sent again on a step change or a re-render. is_onboarding is
      true only on the /setup-wizard route, whatever the account's state; is_edit_mode is true on the edit route.
    question: How many people open the setup wizard, during onboarding or later, and how many of them create a setup?
    track_via: client
    pair: setup_created
    properties:
      - { name: is_edit_mode, type: boolean, example: "false | true" }
      - { name: is_onboarding, type: boolean, example: "true | false", description: "true on the /setup-wizard route only" }
    fires_at:
      - page: /setup-wizard
        element: none (opens from button "Continue to Setup" on /connection-status/[id])
        trigger: page_load
        needs: [signed_in]
      - page: /setups/new
        element: none (opens from link "Create Setup" on /setups, or "Create" on the dashboard)
        trigger: page_load
        needs: [signed_in]
      - page: /setups/[setupId]/edit
        element: none (opens from button "Edit Setup" on /setups/[setupId])
        trigger: page_load
        needs: [signed_in, setup_exists]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Setup Wizard Started
    section: Pravix setups
    status: deprecated
    deprecated_reason: Renamed to snake_case on 18 Nov 2026.
    replaced_by: setup_wizard_started
    dual_fire_until: 2026-12-18
    description: The Title Case twin of setup_wizard_started, sent beside it from the same effect until 2026-12-18.
    question: How many people open the setup wizard?
    track_via: client
    properties:
      - { name: isEditMode, type: boolean, example: "false | true" }
      - { name: isOnboarding, type: boolean, example: "true | false" }
    fires_at:
      - page: /setup-wizard
        element: none (opens from button "Continue to Setup" on /connection-status/[id])
        trigger: page_load
        needs: [signed_in]
      - page: /setups/new
        element: none (opens from link "Create Setup" on /setups, or "Create" on the dashboard)
        trigger: page_load
        needs: [signed_in]
      - page: /setups/[setupId]/edit
        element: none (opens from button "Edit Setup" on /setups/[setupId])
        trigger: page_load
        needs: [signed_in, setup_exists]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: setup_wizard_step_completed
    section: Pravix setups
    description: >-
      The person clicked Next on step 1 (basic_info: name, connection, description) or step 2 (select_checks:
      checks and analysis window) of the setup wizard. Sent in the browser in handleNext before the step
      changes; Next is disabled on step 1 until a name and connection are set. Not sent for step 3 (schedule):
      its button is Create Setup, which submits, and the server's setup_creation_started and setup_created
      record it. Back sends nothing.
    question: Where in the setup wizard do people drop off, during onboarding and after it?
    track_via: client
    properties:
      - { name: step, type: string, example: basic_info | select_checks, values: [basic_info, select_checks] }
      - { name: step_number, type: numeric, example: "1 | 2", values: [1, 2] }
      - { name: is_edit_mode, type: boolean, example: "false | true" }
      - { name: detector_count, type: numeric, example: "4 | 0", description: "Checks selected in the form when Next is clicked" }
      - { name: schedule_frequency, type: string, example: manual | daily, values: [manual, daily, weekly, monthly, custom], description: "The schedule in the form when Next is clicked (manual for a new setup until step 3)" }
    fires_at:
      - page: /setup-wizard
        element: 'button "Next: Select Checks"'
        trigger: click
        needs: [signed_in, name_and_connection_set]
      - page: /setup-wizard
        element: 'button "Next: Schedule"'
        trigger: click
        needs: [signed_in]
      - page: /setups/new
        element: 'button "Next: Select Checks"'
        trigger: click
        needs: [signed_in, name_and_connection_set]
      - page: /setups/new
        element: 'button "Next: Schedule"'
        trigger: click
        needs: [signed_in]
      - page: /setups/[setupId]/edit
        element: 'button "Next: Select Checks"'
        trigger: click
        needs: [signed_in, setup_exists]
      - page: /setups/[setupId]/edit
        element: 'button "Next: Schedule"'
        trigger: click
        needs: [signed_in, setup_exists]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
