      - { name: isEditMode, type: boolean, example: "false | true" }
      - { name: detectorCount, type: numeric, example: "4 | 0" }
      - { name: scheduleFrequency, type: string, example: manual | daily, values: [manual, daily, weekly, monthly, custom] }
    fires_at:
      - page: /setup-wizard
        element: 'button "Next: Select Checks"'
        trigger: click
        needs: [signed_in, name_and_connection_set]
      - page: /setup-wizard
        element: 'button "Next: Schedule"'
        trigger: click
        needs: [signed_in]
      - page: /setups/new
        element: 'button "Next: Select Checks"'
        trigger: click
        needs: [signed_in, name_and_connection_set]
      - page: /setups/new
        element: 'button "Next: Schedule"'
        trigger: click
        needs: [signed_in]
      - page: /setups/[setupId]/edit
        element: 'button "Next: Select Checks"'
        trigger: click
        needs: [signed_in, setup_exists]
      - page: /setups/[setupId]/edit
        element: 'button "Next: Schedule"'
        trigger: click
        needs: [signed_in, setup_exists]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: setup_creation_started
    section: Pravix setups
    description: >-
      POST /api/v1/setups passed validation (a name and connection id, a connection the account owns) and is
      about to create the setup. Sent from the Pravix server before storage.createSetup. Not sent for a
      missing name or connection id (400), an unknown connection (404) or another account's (403).
    question: How many setup creations reach the server, and how many of them end in a saved setup?
    track_via: server
    pair: setup_created
    properties:
      - { name: account_id, type: string, example: 0b6f3c2e-8a41-4d7e-9f15-2c7a9e4b1d03 }
      - { name: connection_id, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: has_schedule, type: boolean, example: "true | false" }
      - { name: detector_count, type: numeric, example: "4 | 1" }
    fires_at:
      - page: /setup-wizard
        element: button "Create Setup"
        trigger: server
        api: POST /api/v1/setups
        needs: [signed_in, verified_connection, detector_selected]
      - page: /setups/new
        element: button "Create Setup"
        trigger: server
        api: POST /api/v1/setups
        needs: [signed_in, verified_connection, detector_selected]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Setup Creation Started
    section: Pravix setups
    status: deprecated
    deprecated_reason: Renamed to snake_case on 18 Nov 2026; setupName (text the person typed) was dropped.
    replaced_by: setup_creation_started
    dual_fire_until: 2026-12-18
    description: The Title Case twin of setup_creation_started, sent beside it before the insert until 2026-12-18.
    question: How many setup creations reach the server?
    track_via: server
    pair: Setup Created
    properties:
      - { name: setupName, type: string, example: Daily checks, description: "The setup name the person typed" }
      - { name: connectionId, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: hasSchedule, type: boolean, example: "true | false" }
      - { name: detectorCount, type: numeric, example: "4 | 1" }
    fires_at:
      - page: /setup-wizard
        element: button "Create Setup"
        trigger: server
