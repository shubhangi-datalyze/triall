  - name: setup_deleted
    section: Pravix setups
    description: >-
      DELETE /api/v1/setups/:setupId deleted a setup, after unscheduling it when it had a cron. Sent from the
      Pravix server after storage.deleteSetup resolves, before the 204. The delete buttons ask for confirmation
      first; cancelling sends nothing. Not sent for a missing setup (404), another account's (403) or a failed
      delete (500).
    question: How many setups get deleted, how old are they, and were they scheduled?
    track_via: server
    properties:
      - { name: setup_id, type: string, example: 7d2e9a40-1c3b-4f5e-8a6d-9b0c1e2f3a4b }
      - { name: account_id, type: string, example: 0b6f3c2e-8a41-4d7e-9f15-2c7a9e4b1d03 }
      - { name: had_schedule, type: boolean, example: "true | false" }
      - { name: age_in_days, type: numeric, example: "12 | 0" }
    fires_at:
      - page: /setups/[setupId]
        element: button "Delete Setup"
        trigger: server
        api: DELETE /api/v1/setups/[setupId]
        needs: [signed_in, setup_exists, confirmed]
      - page: /setups
        element: button "Delete" (a setup's row)
        trigger: server
        api: DELETE /api/v1/setups/[setupId]
        needs: [signed_in, setup_exists, confirmed]
      - page: /
        element: button "Delete" (a setup's row on the dashboard)
        trigger: server
        api: DELETE /api/v1/setups/[setupId]
        needs: [signed_in, setup_exists, confirmed]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
