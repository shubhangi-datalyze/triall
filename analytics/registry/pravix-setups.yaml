        needs: [signed_in, verified_connection, detector_selected]
      - page: /setups/new
        element: button "Create Setup"
        trigger: server
        api: POST /api/v1/setups
        needs: [signed_in, verified_connection, detector_selected]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: setup_created
    section: Pravix setups
    description: >-
      POST /api/v1/setups finished. status=success after the setup row, its checks and (when it has a cron)
      its schedule are written; a scheduling error doesn't fail it. status=failed with failure_reason=server_error
      when anything after validation throws (the route answers 500), which can be after the row was inserted.
      Sent from the Pravix server. Validation rejections (400, 404, 403) send neither this nor
      setup_creation_started. Edits send setup_updated.
    question: How many setups are created each week, with how many checks and a schedule or not, and how many creations fail?
    track_via: server
    pair: setup_creation_started
    properties:
      - { name: account_id, type: string, example: 0b6f3c2e-8a41-4d7e-9f15-2c7a9e4b1d03 }
      - { name: setup_id, type: string, example: 7d2e9a40-1c3b-4f5e-8a6d-9b0c1e2f3a4b, only_when: status=success }
      - { name: connection_id, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: has_schedule, type: boolean, example: "true | false" }
      - { name: detector_count, type: numeric, example: "4 | 1" }
      - { name: status, type: string, example: success | failed, values: [success, failed] }
      - { name: failure_reason, type: string, example: server_error, values: [server_error], only_when: status=failed }
    fires_at:
      - page: /setup-wizard
        element: button "Create Setup"
        trigger: server
        api: POST /api/v1/setups
        needs: [signed_in, verified_connection, detector_selected]
      - page: /setups/new
        element: button "Create Setup"
        trigger: server
        api: POST /api/v1/setups
        needs: [signed_in, verified_connection, detector_selected]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Setup Created
    section: Pravix setups
    status: deprecated
    deprecated_reason: Renamed to snake_case on 18 Nov 2026, with failures folded in as status=failed.
    replaced_by: setup_created
    dual_fire_until: 2026-12-18
    description: The Title Case success twin of setup_created (status=success), sent beside it until 2026-12-18.
    question: How many setups are created each week?
    track_via: server
    pair: Setup Creation Started
    properties:
      - { name: setupId, type: string, example: 7d2e9a40-1c3b-4f5e-8a6d-9b0c1e2f3a4b }
      - { name: setupName, type: string, example: Daily checks, description: "The setup name the person typed" }
      - { name: connectionId, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: hasSchedule, type: boolean, example: "true | false" }
      - { name: detectorCount, type: numeric, example: "4 | 1" }
    fires_at:
      - page: /setup-wizard
        element: button "Create Setup"
        trigger: server
        api: POST /api/v1/setups
        needs: [signed_in, verified_connection, detector_selected]
      - page: /setups/new
        element: button "Create Setup"
        trigger: server
        api: POST /api/v1/setups
        needs: [signed_in, verified_connection, detector_selected]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Setup Creation Failed
    section: Pravix setups
    status: deprecated
    deprecated_reason: Folded into setup_created as status=failed on 18 Nov 2026.
    replaced_by: setup_created
    dual_fire_until: 2026-12-18
    description: >-
      The Title Case failure twin of setup_created (status=failed), sent from the create route's catch until
      2026-12-18. errorMessage is the raw error text.
    question: How many setup creations fail?
    track_via: server
    properties:
      - { name: setupName, type: string, example: Daily checks, description: "The setup name the person typed" }
      - { name: connectionId, type: string, example: 5b48c62e-5484-4225-95d5-570d4cb45992 }
      - { name: errorMessage, type: string, example: "duplicate key value violates unique constraint" }
    fires_at:
      - page: /setup-wizard
        element: button "Create Setup"
        trigger: server
        api: POST /api/v1/setups
        needs: [signed_in, server_error]
      - page: /setups/new
        element: button "Create Setup"
        trigger: server
        api: POST /api/v1/setups
        needs: [signed_in, server_error]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: setup_updated
    section: Pravix setups
    description: >-
      PUT /api/v1/setups/:setupId saved changes to a setup: an edit from the wizard's edit route, or Pause Setup
      / Resume Setup on the setup's page (a status change). Sent from the Pravix server after the update, its
      checks and any re-scheduling. fields_changed lists the fields the request included, not only the ones
      whose value changed: a wizard edit always sends name, description, scheduleCron, scheduleTimezone and
      includeWeekends, and its checks. Not sent for a missing setup (404), another account's (403) or a failed
      write (500).
    question: How often are setups edited, paused or resumed, and what changes?
    track_via: server
    properties:
      - { name: setup_id, type: string, example: 7d2e9a40-1c3b-4f5e-8a6d-9b0c1e2f3a4b }
      - { name: account_id, type: string, example: 0b6f3c2e-8a41-4d7e-9f15-2c7a9e4b1d03 }
      - { name: fields_changed, type: array, example: "[status] | [name, description, scheduleCron, scheduleTimezone, includeWeekends]" }
      - { name: detectors_changed, type: boolean, example: "true | false", description: "true when the request included the checks (every wizard edit)" }
      - { name: schedule_changed, type: boolean, example: "true | false", description: "true when the request included the cron, timezone or status" }
    fires_at:
      - page: /setups/[setupId]/edit
        element: button "Create Setup" (the edit wizard's last step keeps this label)
        trigger: server
        api: PUT /api/v1/setups/[setupId]
        needs: [signed_in, setup_exists]
      - page: /setups/[setupId]
        element: button "Pause Setup"
        trigger: server
        api: PUT /api/v1/setups/[setupId]
        needs: [signed_in, setup_status=active]
      - page: /setups/[setupId]
        element: button "Resume Setup"
        trigger: server
        api: PUT /api/v1/setups/[setupId]
        needs: [signed_in, setup_status=paused]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
