events:
  - name: tracking_agent_onboarding_github_completed
    section: Tracking Agent
    description: >-
      Onboarding screen "Connect GitHub" completed: the person signed in to GitHub with the setup scopes and pressed Continue. Sent from the server by PUT /api/tracking-agent/workspace
      when the saved step moves past this screen (the save sets step=repos), after the progress row is written.
      Once per workspace: not sent when the step stays, goes back, or was already further on (another device,
      a reload), and not for members, who never onboard. Workspaces set up before onboarding existed never send it.
    question: How many workspaces get past the Connect GitHub screen of Tracking Agent onboarding, and where do they drop off?
    track_via: server
    properties:
      - { name: email, type: string, example: owner@acme.com, description: "The account's email, added by trackServer (.datalyze/context.md: email on every relevant event)" }
    fires_at:
      - page: /tracking-agent/start/github
        element: button "Continue" (the Connect GitHub screen)
        trigger: server
        api: PUT /api/tracking-agent/workspace
        needs: [signed_in, "role=owner|admin", "GitHub connected with the setup scopes"]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: tracking_agent_onboarding_repos_completed
