      Onboarding screen "Install" completed: the person pressed Continue once the Datalyze GitHub App is installed on the picked repos and the keys are saved as secrets. Sent from the server by PUT /api/tracking-agent/workspace
      when the saved step moves past this screen (the save sets step=setup-pr), after the progress row is written.
