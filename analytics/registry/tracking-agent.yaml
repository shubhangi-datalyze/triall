  - name: tracking_agent_onboarding_setup_pr_completed
    section: Tracking Agent
    description: >-
      Onboarding screen "Setup pull request" completed: the person pressed Continue once every picked repo has its setup pull request opened (or was already set up). Continue does not wait for the merge: a setup PR still open counts. Sent from the server by PUT /api/tracking-agent/workspace
      when the saved step moves past this screen (the save sets step=pay), after the progress row is written.
      Once per workspace: not sent when the step stays, goes back, or was already further on (another device,
      a reload), and not for members, who never onboard. Workspaces set up before onboarding existed never send it.
    question: How many workspaces get past the Setup pull request screen of Tracking Agent onboarding, and where do they drop off?
    track_via: server
    properties:
      - { name: email, type: string, example: owner@acme.com, description: "The account's email, added by trackServer (.datalyze/context.md: email on every relevant event)" }
    fires_at:
      - page: /tracking-agent/start/setup-pr
        element: button "Continue" (the Setup pull request screen)
        trigger: server
        api: PUT /api/tracking-agent/workspace
        needs: [signed_in, "role=owner|admin", "a setup PR opened on every picked repo"]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: tracking_agent_onboarding_completed
    section: Tracking Agent
    description: >-
      Tracking Agent onboarding finished: the save that moves the step to pay (Continue on the Setup pull request
      screen), sent from the server by PUT /api/tracking-agent/workspace in the same request as
      tracking_agent_onboarding_setup_pr_completed. Onboarding counts as finished on reaching the Pay screen
      (flow.ts onboarded), so it fires before any payment: paying is the Billing area's checkout events. Once per
      workspace; not sent for members or for workspaces set up before onboarding existed.
    question: How many new workspaces finish Tracking Agent onboarding each week, with how many repos, and how many then pay?
    track_via: server
    properties:
      - { name: email, type: string, example: owner@acme.com, description: "The account's email, added by trackServer (.datalyze/context.md: email on every relevant event)" }
      - { name: repo_count, type: numeric, example: "1 | 3", description: "How many repos the person picked during onboarding (distinct GitHub repo ids saved with the progress)" }
    fires_at:
      - page: /tracking-agent/start/setup-pr
        element: button "Continue" (the Setup pull request screen)
        trigger: server
        api: PUT /api/tracking-agent/workspace
        needs: [signed_in, "role=owner|admin", "a setup PR opened on every picked repo"]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: audit_run_started
    section: Tracking Agent
    description: >-
      GitHub accepted an audit run that the Datalyze app started for a signed-in account: the server's GitHub
      relay sends it when GitHub answers 204 to the workflow_dispatch with inputs.job=audit, after the dispatch
      succeeds and before the run does anything. It is the intent: the run can still fail, and nothing here says
      how it ends. Not sent for publishing a kept audit (an audit dispatch with findings, which runs nothing), when
      GitHub refuses the dispatch, for audits started from GitHub's own Actions page or the Claude Code plugin,
      or through a GitHub sign-in that isn't bound to a Datalyze account.
    question: How many audits do workspaces start from the app each week, on which repos, and how many are first audits?
    track_via: server
    properties:
      - { name: email, type: string, example: owner@acme.com, description: "The signed-in account's email, added by trackServer" }
      - { name: github_repo, type: string, example: acme/web | aagrawal17091999/joindatalyze, description: "The audited repo as owner/name, from the dispatch path" }
    fires_at:
      - page: /tracking-agent/dashboard
        element: button "Run audit" (Needs you, "No audit yet"; "Run again" when the first audit failed)
        trigger: server
        api: POST /api/tracking-agent/github/api/repos/[owner]/[repo]/actions/workflows/datalyze.yml/dispatches
        needs: [signed_in, GitHub connected, "the workflow on the default branch"]
      - page: /tracking-agent/dashboard
        element: button "Run audit" (the repo's row in Repos; "Run again" after a failed audit, "Do another audit" once audited)
        trigger: server
        api: POST /api/tracking-agent/github/api/repos/[owner]/[repo]/actions/workflows/datalyze.yml/dispatches
        needs: [signed_in, GitHub connected, "the workflow on the default branch"]
      - page: /tracking-agent/setup
        element: button "Run the first audit" (the repo's row; "Run it again" after it failed)
        trigger: server
        api: POST /api/tracking-agent/github/api/repos/[owner]/[repo]/actions/workflows/datalyze.yml/dispatches
        needs: [signed_in, GitHub connected, "the setup PR merged"]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: verify_run_started
    section: Tracking Agent
    description: >-
      A signed-in person with write access to the repo pressed Verify on the Verification screen's Start tab, and the
      site wrote the run: sent by the server from POST /api/tracking-agent/verify/runs once the run row exists, just
      before the worker is launched on Cloud Run. It is the intent: the run can still fail (a refused launch included)
      or be stopped, which verify_run_ended says. Not sent when the request is refused (no Anthropic key saved, no
      write access, more than 25 events, the site not set up), and not for runs started with /datalyze:verify in
      Claude Code on a laptop (Phase A), which Datalyze never sees.
    question: How many hosted verification runs do workspaces start each week, on which repos and environments, and how many events each?
    track_via: server
    properties:
      - { name: email, type: string, example: "owner@acme.com", description: "The account that started the run, added by trackServer" }
      - { name: run_id, type: string, example: 9e1f235c-8af9-4096-930c-2de732be2188, description: "verify_runs.id: joins the start to the end" }
      - { name: github_repo, type: string, example: "acme/web | aagrawal17091999/joindatalyze", description: "The verified repo as owner/name" }
      - { name: verify_environment, type: string, example: "staging | production | seedly-mixpanel", description: "The verify environment the run checks, by its name in the repo's verify config" }
      - { name: event_count, type: numeric, example: 3, description: "Events (or event.property picks) in the run" }
    fires_at:
      - page: /tracking-agent/verify/[owner]/[repo]
        element: "button \"Verify\" (the Start tab's bar)"
        trigger: server
        api: POST /api/tracking-agent/verify/runs
        needs: [signed_in, write access to the repo, an Anthropic key saved for the repo]
    changelog:
      - { date: 2026-11-24, ref: main, change: "Added: hosted verification runs (VERIFY.md §11 Phase B, step 3)" }
      - { date: 2026-11-24, ref: main, change: "SEMANTICS: sent before the launch, so a refused launch has its start" }
  - name: verify_run_ended
    section: Tracking Agent
    description: >-
      A hosted verification run settled: every shard has ended. Sent once per run by the server, from where the last
      shard's status is written (setShardStatus): the Cloud Run worker when the run finishes or fails, the Stop
      endpoint when the person stops it, and the Start endpoint when Cloud Run refuses the launch. status=cancelled
      means the person pressed Stop and is not a failure. Not sent for runs started in Claude Code on a laptop.
    question: How many hosted verification runs finish, fail or get stopped, why they fail, what they cost in model dollars and browser minutes, and how often they need a person?
    track_via: server
    pair: verify_run_started
    properties:
      - { name: email, type: string, example: "owner@acme.com", description: "The account that started the run, added by trackServer" }
      - { name: run_id, type: string, example: 9e1f235c-8af9-4096-930c-2de732be2188, description: "verify_runs.id: joins the start to the end" }
      - { name: github_repo, type: string, example: "acme/web | aagrawal17091999/joindatalyze", description: "The verified repo as owner/name" }
      - { name: verify_environment, type: string, example: "staging | production | seedly-mixpanel", description: "The verify environment the run checks, by its name in the repo's verify config" }
      - { name: event_count, type: numeric, example: 3, description: "Events (or event.property picks) in the run" }
      - { name: status, type: string, example: "success | failed | cancelled", values: [success, failed, cancelled], description: "success: every shard done; cancelled: the person pressed Stop; failed: any shard failed" }
      - { name: failure_reason, type: string, example: "launch | no_anthropic_key | environment_not_ready | plugin_not_loaded | spending_cap | turn_limit | time_limit | no_final_report | push_failed | worker_error", only_when: "status=failed", description: "Mapped from the worker's fail() reasons in worker/verify/run.ts and the Start endpoint's launch failure" }
      - { name: duration_ms, type: numeric, example: 80000, description: "verify_runs.created_at to ended_at" }
      - { name: passed_count, type: numeric, example: 3, description: "Events whose last check passed" }
      - { name: failed_count, type: numeric, example: 1, description: "Events whose last check found a problem" }
      - { name: questions_asked, type: numeric, example: "0 | 2", description: "Needs-you cards (ask rows) in the run" }
      - { name: model_cost_usd, type: numeric, example: 0.12, description: "The shards' model cost, from their cost rows (the customer's Anthropic key)" }
      - { name: browser_minutes, type: numeric, example: 0.95, description: "The shards' cloud browser minutes" }
    fires_at:
      - page: /tracking-agent/verify/[owner]/[repo]/runs/[id]
        element: "button \"Stop\""
        trigger: server
        api: POST /api/tracking-agent/verify/runs/[id]/stop
        needs: [signed_in, write access to the repo, a run still going]
      - page: /tracking-agent/verify/[owner]/[repo]/runs/[id]
        element: "none: the Cloud Run worker ends the run (job verify-worker, started by POST /api/tracking-agent/verify/runs)"
        trigger: server
        api: POST /api/tracking-agent/verify/runs
        needs: [a run started with Verify]
      - page: /tracking-agent/verify/[owner]/[repo]
        element: "button \"Verify\" (the Start tab's bar), when Cloud Run refuses the launch"
        trigger: server
        api: POST /api/tracking-agent/verify/runs
        needs: [signed_in, write access to the repo]
    changelog:
      - { date: 2026-11-24, ref: main, change: "Added: hosted verification runs (VERIFY.md §11 Phase B, step 3)" }
  - name: verify_run_answered
    section: Tracking Agent
    description: >-
      A Needs-you card in a hosted verification run was answered: the person pressed Done or Skip on it, typed a
      message while it was open (replied), or nobody answered in 10 minutes and the worker skipped it (timeout). Sent
      once per card by the server: from POST /api/tracking-agent/verify/runs/[id]/messages for done, skip and
      replied, after the answer row is written, and from the Cloud Run worker for timeout. Not sent for messages
      typed when no card is open, or for runs on a laptop.
    question: When a hosted run needs a person, how often do they press Done, Skip, reply in the chat, or not answer at all, and on which events?
    track_via: server
    properties:
      - { name: email, type: string, example: "owner@acme.com", description: "The person who answered; for timeout, the account that started the run. Added by trackServer" }
      - { name: run_id, type: string, example: 9e1f235c-8af9-4096-930c-2de732be2188, description: "verify_runs.id" }
      - { name: github_repo, type: string, example: "acme/web | aagrawal17091999/joindatalyze", description: "The verified repo as owner/name" }
      - { name: answer, type: string, example: "done | skip | replied | timeout", values: [done, skip, replied, timeout], description: "How the card was answered" }
      - { name: event_name, type: string, example: "plan_selected | signup_started", only_when: "the agent's ask names an event (ask_person's event)", description: "The event the card asked about" }
    fires_at:
      - page: /tracking-agent/verify/[owner]/[repo]/runs/[id]
        element: "button \"Done\" or \"Skip\" on a Needs-you card"
        trigger: server
        api: POST /api/tracking-agent/verify/runs/[id]/messages
        needs: [signed_in, write access to the repo, an open Needs-you card]
      - page: /tracking-agent/verify/[owner]/[repo]/runs/[id]
        element: "button \"Send\" (the chat) while a Needs-you card is open"
        trigger: server
        api: POST /api/tracking-agent/verify/runs/[id]/messages
        needs: [signed_in, write access to the repo, an open Needs-you card]
      - page: /tracking-agent/verify/[owner]/[repo]/runs/[id]
        element: "none: the Cloud Run worker, 10 minutes after the card opened with no answer"
        trigger: server
        api: POST /api/tracking-agent/verify/runs
        needs: [an open Needs-you card]
    changelog:
      - { date: 2026-11-24, ref: main, change: "Added: hosted verification runs (VERIFY.md §11 Phase B, step 3)" }
