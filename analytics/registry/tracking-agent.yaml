    question: How many workspaces get past the Choose repos screen of Tracking Agent onboarding, and where do they drop off?
    track_via: server
    properties:
      - { name: email, type: string, example: owner@acme.com, description: "The account's email, added by trackServer (.datalyze/context.md: email on every relevant event)" }
      - { name: repo_count, type: numeric, example: "1 | 3", description: "How many repos the person picked on this screen (distinct GitHub repo ids, 1 to 50)" }
    fires_at:
      - page: /tracking-agent/start/repos
        element: button "Continue with {n} repos" (the Choose repos screen; "Continue with 1 repo" for one)
        trigger: server
        api: PUT /api/tracking-agent/workspace
        needs: [signed_in, "role=owner|admin", "at least one repo picked"]
