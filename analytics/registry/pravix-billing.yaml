        trigger: click
        needs: [signed_in, upgrade required]
      - page: /pravix/setups/[setupId]
        element: button "Run Now"
        trigger: click
        needs: [signed_in, upgrade required]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: usage_limit_reached
    section: Pravix billing
    description: >-
      Sent by the Pravix server after an account's first run completes (the free quota is one run), when the billing
      service creates the account's billing session as free_quota_exhausted or moves an existing one to it. Sent at
      most once per account in practice. Not sent on later runs, and not when a paid record balance runs out: that
      state (balance_exhausted) is worked out when billing status is read, with no event.
    question: How many accounts use up the free run each week, and how many of them then pay?
    track_via: server
    properties:
      - { name: run_id, type: string, example: 9b1e4c7a-2d3f-4e5a-8b6c-0d1e2f3a4b5c }
      - { name: limit_type, type: string, example: free_quota, values: [free_quota] }
      - { name: completed_runs, type: numeric, example: "1" }
    fires_at:
      - page: /pravix/setups/[setupId]
        element: the account first run finishing (no person present; the run worker posts its completion)
        trigger: server
        api: POST /api/v1/internal/pubsub/completion
        needs: [first completed run for the account]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Usage Limit Reached
    section: Pravix billing
    status: deprecated
