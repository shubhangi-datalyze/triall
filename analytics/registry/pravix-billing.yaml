events:
  - name: Payment Succeeded
    section: Pravix billing
    status: deprecated
    deprecated_reason: >-
      Folded into payment_completed with status=success on 18 Nov 2026 (one outcome event with status, not a
      success and a failure event); sent beside it until 2026-12-18.
    replaced_by: payment_completed
    dual_fire_until: 2026-12-18
    description: >-
      Sent by the Pravix server from the Stripe invoice.payment_succeeded webhook, after the payment history row is
      written, for the account's owner. Fires for the first invoice of a subscription and for every renewal, and
      for a $0 invoice too. Not sent for an invoice with no subscription, a subscription Pravix has no row for, or
      an account with no owner.
    question: How much revenue does Pravix collect each month, from how many paying accounts?
    track_via: server
    properties:
      - { name: accountId, type: string, example: 3f6c1d2e-8a4b-4c3f-9d1e-2b7a5c9e0f14 }
      - { name: amount, type: numeric, example: "49", description: "invoice.amount_paid in major units of currency (dollars)" }
      - { name: currency, type: string, example: usd }
      - { name: stripeInvoiceId, type: string, example: in_1QbX7aKZ2s9fT4hJ }
      - { name: stripeSubscriptionId, type: string, example: sub_1QbX6zKZ2s9fT4hJ }
      - { name: periodStart, type: numeric, example: "1763510400", description: "The invoice period's start, unix seconds" }
      - { name: periodEnd, type: numeric, example: "1766102400", description: "The invoice period's end, unix seconds" }
    fires_at:
      - page: /pravix
        element: Stripe Checkout "Subscribe" (Stripe hosted page), then each monthly renewal with no page; Stripe webhook invoice.payment_succeeded
        trigger: server
        api: POST /api/v1/webhooks/stripe
        needs: [signed_in, a Stripe subscription for the account]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Payment Failed
    section: Pravix billing
    status: deprecated
    deprecated_reason: >-
      Folded into payment_completed with status=failed on 18 Nov 2026; sent beside it until 2026-12-18.
    replaced_by: payment_completed
    dual_fire_until: 2026-12-18
    description: >-
      Sent by the Pravix server from the Stripe invoice.payment_failed webhook, after the billing session is set to
      payment_failed, attributed to the account's owner (anonymous when the owner can't be found). Fires once per
      failed attempt, so Stripe's retries each send one. Not sent for an invoice with no subscription or a
      subscription Pravix has no row for.
    question: How many Pravix renewals fail, and how many recover on a later attempt?
    track_via: server
    properties:
      - { name: amount, type: numeric, example: "49", description: "invoice.amount_due in major units of currency (dollars)" }
      - { name: currency, type: string, example: usd }
      - { name: stripeInvoiceId, type: string, example: in_1QbX7aKZ2s9fT4hJ }
      - { name: stripeSubscriptionId, type: string, example: sub_1QbX6zKZ2s9fT4hJ }
      - { name: attemptCount, type: numeric, example: "1 | 2 | 3" }
    fires_at:
      - page: /pravix
        element: a Stripe renewal charge that fails (no page); Stripe webhook invoice.payment_failed
        trigger: server
        api: POST /api/v1/webhooks/stripe
        needs: [a Stripe subscription for the account]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: payment_initiated
    section: Pravix billing
    description: >-
      Sent by the Pravix server when POST /api/v1/billing/setup-intent has created the Stripe customer (if needed)
      and a Stripe Checkout session for the $49/month plan, just before it answers with the Checkout URL. The intent
      of the paid funnel: the outcome is payment_completed from the invoice webhook, and an abandoned Checkout is an
      intent with no outcome. Not sent when creating the session fails. Sent from the paywall's Set Up Payment
      Method and from Settings' Upgrade and Reactivate buttons alike.
    question: How many accounts start Pravix checkout each week, and how many of them go on to pay?
    track_via: server
    properties:
      - { name: account_id, type: string, example: 3f6c1d2e-8a4b-4c3f-9d1e-2b7a5c9e0f14 }
      - { name: stripe_customer_id, type: string, example: cus_RkT2m9XbQ4vLpa }
      - { name: checkout_session_id, type: string, example: cs_live_a1B2c3D4e5F6g7H8 }
    fires_at:
      - page: /pravix
        element: button "Set Up Payment Method" (the upgrade dialog)
        trigger: server
        api: POST /api/v1/billing/setup-intent
        needs: [signed_in, stripe available]
      - page: /pravix/settings
        element: button "Upgrade to $49/month Plan"
        trigger: server
        api: POST /api/v1/billing/setup-intent
        needs: [signed_in, no active subscription]
      - page: /pravix/settings
        element: button "Reactivate Subscription"
        trigger: server
        api: POST /api/v1/billing/setup-intent
        needs: [signed_in, subscription set to cancel at period end]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
