        trigger: server
        api: POST /api/v1/billing/setup-intent
        needs: [signed_in, no active subscription]
      - page: /pravix/settings
        element: button "Reactivate Subscription"
        trigger: server
        api: POST /api/v1/billing/setup-intent
        needs: [signed_in, subscription set to cancel at period end]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: subscription_canceled
    section: Pravix billing
    description: >-
      Sent by the Pravix server when a person cancels from Settings: after POST /api/v1/billing/cancel has asked
      Stripe to cancel the subscription at the end of the period and the local subscription and billing session are
      marked cancelled. The subscription keeps working until current_period_end. Not sent when the subscription was
      already cancelled (the handler answers early), when the Stripe call fails, or when Stripe itself ends the
      subscription (customer.subscription.deleted sends nothing).
    question: How many paying accounts cancel Pravix each month, and how long before their period ends?
    track_via: server
    properties:
      - { name: account_id, type: string, example: 3f6c1d2e-8a4b-4c3f-9d1e-2b7a5c9e0f14 }
      - { name: cancel_at_period_end, type: boolean, example: "true" }
      - { name: current_period_end, type: datetime, example: "2026-12-19T08:30:00.000Z" }
    fires_at:
      - page: /pravix/settings
        element: button "Cancel $49/month Subscription", then OK in the browser's confirm dialog
        trigger: server
        api: POST /api/v1/billing/cancel
        needs: [signed_in, active Stripe subscription]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Subscription Canceled
    section: Pravix billing
    status: deprecated
    deprecated_reason: Renamed to snake_case on 18 Nov 2026; sent beside subscription_canceled until 2026-12-18.
    replaced_by: subscription_canceled
    dual_fire_until: 2026-12-18
    description: >-
      The Title Case twin of subscription_canceled, sent from the same cancel handler on the line before it.
    question: How many paying accounts cancel Pravix each month, and how long before their period ends?
    track_via: server
    properties:
      - { name: accountId, type: string, example: 3f6c1d2e-8a4b-4c3f-9d1e-2b7a5c9e0f14 }
      - { name: cancelAtPeriodEnd, type: boolean, example: "true" }
      - { name: currentPeriodEnd, type: datetime, example: "2026-12-19T08:30:00.000Z" }
    fires_at:
      - page: /pravix/settings
        element: button "Cancel $49/month Subscription", then OK in the browser's confirm dialog
        trigger: server
        api: POST /api/v1/billing/cancel
        needs: [signed_in, active Stripe subscription]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: upgrade_modal_viewed
    section: Pravix billing
    description: >-
      Sent in the browser each time the Pravix paywall dialog opens. It opens by itself once per app load when the
      billing status is free_quota_exhausted or balance_exhausted with no payment method, and when the person clicks
      Run or Run Now on a setup while an upgrade is required (instead of starting the run). The top of the paid
      funnel; payment_initiated is the next step. Not sent again while the dialog stays open.
    question: How many accounts hit the Pravix paywall, and how many of them go on to start checkout?
    track_via: client
    properties:
      - { name: reason, type: string, example: run_paywall, values: [run_paywall] }
      - { name: billing_status, type: string, example: free_quota_exhausted | balance_exhausted | payment_failed }
      - { name: has_payment_method, type: boolean, example: "false | true" }
      - { name: rows_analyzed, type: numeric, example: "4820 | 0", description: "Rows in the account's latest usage record, else the total usage" }
      - { name: total_usage, type: numeric, example: "4820 | 0", description: "Rows analysed across the account's usage records" }
    fires_at:
      - page: /pravix
        element: dialog "Upgrade to Continue Processing Data" opening by itself (any signed-in page)
        trigger: page_load
        needs: [signed_in, billing status free_quota_exhausted or balance_exhausted, no payment method]
      - page: /pravix/setups
        element: button "Run" (a setup row)
        trigger: click
        needs: [signed_in, upgrade required]
      - page: /pravix/setups/[setupId]
        element: button "Run Now"
        trigger: click
        needs: [signed_in, upgrade required]
    changelog:
      - { date: 2026-11-19, ref: audit, change: Added to the plan by the first audit }
      - { date: 2026-11-19, ref: audit, change: "Where it fires, added" }
  - name: Upgrade Modal Viewed
    section: Pravix billing
    status: deprecated
    deprecated_reason: Renamed to snake_case on 18 Nov 2026; sent beside upgrade_modal_viewed until 2026-12-18.
    replaced_by: upgrade_modal_viewed
